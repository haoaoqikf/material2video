[project]
name = "compound-connect"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "playwright==1.63.0",
  "imageio-ffmpeg==0.6.0",
  "edge-tts==7.3.1",
  "pillow==13.0.0",
  "psutil==7.2.2",
  "fonttools==4.65.0",
  "pydantic==2.14.2"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["runtime/python"]

[tool.setuptools.package-data]
"film_runtime.engine" = ["design_sample_viewer.html"]
