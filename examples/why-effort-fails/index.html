<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>为什么努力没结果｜article2video 示例</title>

<!--
  共享资源由 skill 提供，示例只负责视觉表达。
  引入顺序：base.css（画布与安全区）→ theme.css（设计令牌）
  → figures.css（组件库样式）→ 页面样式，这样页面永远拥有最终覆盖权。
-->
<link rel="stylesheet" href="../../.agents/skills/article2video/assets/base.css">
<link rel="stylesheet" href="../../.agents/skills/article2video/assets/theme.css">
<link rel="stylesheet" href="../../.agents/skills/article2video/assets/figures.css">

<style>
  /*
   * 本视频的视觉语言：深色底 + 单一青色强调 + 三层背景（光晕 / 网格 / 细点阵），
   * 与《永远不要害怕面试》的浅色纸张底相对，说明同一个组件库换一套令牌就能换一套观感。
   *
   * 页面只剩三件事：舞台、常驻背景、每幕的挂载点。图形与动效都在组件库里，
   * 页面不再画任何一笔——示例的作用就是展示这条路走得通。
   */
  :root {
    /* 页面级微调：只覆盖主题令牌，不改画布与安全区 */
    --a2v-grid-size: 120px;
    --a2v-glow-1: rgba(53, 224, 200, 0.2);
    --a2v-glow-2: rgba(96, 132, 255, 0.16);
  }

  [data-a2v-stage] {
    background: var(--a2v-bg-0);
  }

  /*
   * 层叠顺序：常驻背景（0）→ 场景（1）。
   * 场景容器由运行时逐个显示/隐藏，必须显式抬到背景之上。
   */
  .stage-bg {
    z-index: 0;
  }

  [data-a2v-scene] {
    z-index: 1;
  }

  /* 场景角标：组件库不画它，它属于这一页的版式语言 */
  .scene-tag {
    position: absolute;
    top: 140px;
    left: var(--a2v-safe-x);
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: var(--a2v-font-sans);
    font-size: 30px;
    letter-spacing: var(--a2v-tracking-label);
    color: var(--a2v-text-3);
  }

  .scene-tag .tag-index {
    color: var(--a2v-accent);
    font-variant-numeric: tabular-nums;
  }

  .scene-tag .tag-rule {
    width: 64px;
    height: 1px;
    background: var(--a2v-hairline-strong);
  }
</style>
</head>
<body>

<!--
  场景容器只保留结构，所有文案与图形标注都从 storyboard.json 注入。
  页面里不重复写一份文案，避免与分镜漂移。
-->
<div data-a2v-stage>

  <!-- 常驻背景：三个纯 CSS 渐变层，切换场景时保持不动 -->
  <div class="a2v-bg-glow stage-bg" aria-hidden="true"></div>
  <div class="a2v-bg-grid stage-bg" aria-hidden="true"></div>
  <div class="a2v-bg-grain stage-bg" aria-hidden="true"></div>

  <section data-a2v-scene data-scene-id="opening">
    <div class="scene-tag">
      <span class="tag-index">01</span>
      <span class="tag-rule"></span>
      <span>开场命题</span>
    </div>
    <div class="a2v-safe" data-a2v-figure></div>
  </section>

  <section data-a2v-scene data-scene-id="thesis">
    <div class="scene-tag">
      <span class="tag-index">02</span>
      <span class="tag-rule"></span>
      <span>真正的分歧</span>
    </div>
    <div class="a2v-safe" data-a2v-figure></div>
  </section>

  <section data-a2v-scene data-scene-id="choice">
    <div class="scene-tag">
      <span class="tag-index">03</span>
      <span class="tag-rule"></span>
      <span>两种反应</span>
    </div>
    <div class="a2v-safe" data-a2v-figure></div>
  </section>

  <section data-a2v-scene data-scene-id="loop">
    <div class="scene-tag">
      <span class="tag-index">04</span>
      <span class="tag-rule"></span>
      <span>约束会移动</span>
    </div>
    <div class="a2v-safe" data-a2v-figure></div>
  </section>

  <section data-a2v-scene data-scene-id="closing">
    <div class="scene-tag">
      <span class="tag-index">05</span>
      <span class="tag-rule"></span>
      <span>收束</span>
    </div>
    <div class="a2v-safe" data-a2v-figure></div>
  </section>

</div>

<div data-a2v-controls class="a2v-preview-only">
  <button type="button" data-a2v-play>播放</button>
  <button type="button" data-a2v-replay>重播</button>
  <input type="range" data-a2v-seek min="0" max="1" value="0" aria-label="进度">
  <span data-a2v-time>0:00 / 0:00</span>
</div>

<!-- 弹簧求解器：timeline.js 的依赖（vendored 阻尼谐振子闭式解，wobble 1.5.1 · MIT） -->
<script src="../../.agents/skills/article2video/assets/vendor/spring.js"></script>
<script src="../../.agents/skills/article2video/assets/timeline.js"></script>
<script src="../../.agents/skills/article2video/assets/figures.js"></script>
<script>
(function () {
  'use strict';

  /*
   * 页面只负责「舞台 + 背景 + 每幕的挂载点」，画面本身交给组件库。
   * 这里的映射是导演选择：一种内容形态默认用哪个组件。分镜在
   * data.figure.kind 里显式指定时以分镜为准，页面不参与二次判断。
   */
  var DEFAULT_FIGURES = {
    title: 'balance',
    quote: 'gap',
    comparison: 'versus',
    list: 'iceberg',
    diagram: 'loop',
    timeline: 'stairs',
    conclusion: 'exchange'
  };

  /** 单帧渲染入口：由时间轴运行时按帧号调用，必须保持纯函数式。 */
  function renderFrame(state, api) {
    A2V.figures.renderScene(state, api, { defaults: DEFAULT_FIGURES });
  }

  A2V.fetchStoryboard('storyboard.json')
    .then(function (storyboard) {
      A2V.mount({ storyboard: storyboard, render: renderFrame });
      return window.__A2V__.ready();
    })
    .catch(function (error) {
      // 出错时把原因写进画面，避免渲染出「全黑但成功」的视频
      document.body.innerHTML =
        '<pre style="color:#ff6b6b;font:20px/1.6 monospace;padding:60px;white-space:pre-wrap">' +
        '页面初始化失败：' + (error && error.message ? error.message : error) +
        '</pre>';
      throw error;
    });
})();
</script>
</body>
</html>
