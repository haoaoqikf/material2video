name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: common-1
            paths: "tests/common"
            slice: "0"
          - shard: common-2
            paths: "tests/common"
            slice: "1"
          - shard: common-3
            paths: "tests/common"
            slice: "2"
          - shard: common-4
            paths: "tests/common"
            slice: "3"
          - shard: types
            paths: "tests/types"
            slice: ""
          - shard: rest
            paths: "tests/standalone tests/works"
            slice: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
          python -m pip check
      - name: Run fast tests
        run: |
          set -uo pipefail
          targets="${{ matrix.paths }}"
          if [ -n "${{ matrix.slice }}" ]; then
            targets=$(ls tests/common/test_*.py | awk -v keep=${{ matrix.slice }} 'NR % 4 == keep' | tr '\n' ' ')
            echo "本分片文件：$targets"
          fi
          log="pytest-${{ matrix.shard }}.log"
          rc=0
          timeout --kill-after=30 900 python -m pytest -n 1 --dist loadfile \
            --timeout=60 --timeout-method=signal -v $targets > "$log" 2>&1 || rc=$?
          echo "pytest 退出码：$rc"
          tail -n 120 "$log"
          exit "$rc"
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.shard }}
          path: pytest-${{ matrix.shard }}.log
          if-no-files-found: warn
