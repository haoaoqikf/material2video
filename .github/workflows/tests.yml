name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: common
            paths: tests/common
          - shard: types
            paths: tests/types
          - shard: rest
            paths: tests/standalone tests/works
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
          python -m pip check
      - name: Run fast tests
        run: python -m pytest -n 2 --dist loadfile ${{ matrix.paths }}
