name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: common-a
            paths: "tests/common"
            slice: "1"
          - shard: common-b
            paths: "tests/common"
            slice: "0"
          - shard: types
            paths: "tests/types"
            slice: ""
          - shard: rest
            paths: "tests/standalone tests/works"
            slice: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
          python -m pip check
      - name: Run fast tests
        run: |
          set -euo pipefail
          targets="${{ matrix.paths }}"
          if [ -n "${{ matrix.slice }}" ]; then
            targets=$(ls tests/common/test_*.py | awk -v keep=${{ matrix.slice }} 'NR % 2 == keep' | tr '\n' ' ')
            echo "本分片文件：$targets"
          fi
          python -m pytest -n 2 --dist loadfile $targets
