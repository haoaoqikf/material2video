name: 提出功能建议
description: 描述一个制作或复现需求，以及如何判断它已满足。
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 写明作品类型、当前制作步骤和遇到的限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为及验收方式
      description: 给出典型输入、应得到的结果，以及对现有作品或流程的影响。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代办法或参考
      description: 可附相关 Issue、OpenSpec 变更或示例。不要提交私人素材或凭据。
