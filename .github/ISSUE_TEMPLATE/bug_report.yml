name: 报告复现问题
description: 报告安装、验证、渲染或示例复现的异常。
title: "[问题] "
body:
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 写明系统和终端、提交或版本，以及 Python、uv、Node.js、pnpm 版本；涉及三维时补充 GPU 和驱动。
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: 复现命令与步骤
      description: 给出工作目录、作品类型或示例路径、执行顺序和最小输入。请移除私人路径、素材和凭据。
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如有报错，请提供退出码与脱敏后的关键段落。
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: 是否附抽帧或日志
      options:
        - 已附抽帧
        - 已附日志
        - 两者均已附
        - 暂无（请说明原因）
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 证据及补充说明
      description: 可拖入脱敏抽帧或日志；抽帧请注明成片时间点或帧号。
