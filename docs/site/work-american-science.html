<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>从电报到大模型 · Material2Video</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead shell">
    <a class="brand" href="index.html">Material2Video</a>
    <a href="index.html#works">作品集</a>
  </header>
  <main class="work shell">
    <header class="work-intro">
      <p class="meta">纪实素材剪辑 <span>30 秒</span></p>
      <h1>从电报到大模型</h1>
      <p>用馆藏资料串起美国主导或参与的十项科技里程碑。看摩尔斯纸带上的信号、贝尔电话旁表示声音的波形，以及莱特兄弟首飞时离地的飞行器。</p>
    </header>
    <figure class="work-media">
      <video src="assets/clip-american-science.mp4" poster="assets/poster-american-science.jpg" width="720" height="406" autoplay muted loop playsinline preload="metadata" controls aria-label="从电报纸带、电话到首飞等档案镜头的静音片段"></video>
      <figcaption>开篇档案 · 成片 00:00.4–00:08.4 · 静音</figcaption>
    </figure>
    <div class="work-details">
      <section>
        <h2>它由这些组成</h2>
        <ul>
          <li><a href="https://github.com/haoaoqikf/material2video/blob/main/examples/documentary-edit/american-science-milestones/storyboard.json">分镜</a> <span>档案章节与剪辑时序</span></li>
          <li><a href="https://github.com/haoaoqikf/material2video/blob/main/examples/documentary-edit/american-science-milestones/scenes/telegraph.tsx">场景源码</a> <span>电报纸带与信号</span></li>
          <li><a href="https://github.com/haoaoqikf/material2video/blob/main/examples/documentary-edit/american-science-milestones/assets/media-sources.json">材料</a> <span>档案来源和使用记录</span></li>
        </ul>
      </section>
      <section>
        <h2>想改这里</h2>
        <p>在 <a href="https://github.com/haoaoqikf/material2video/blob/main/examples/documentary-edit/american-science-milestones/storyboard.json#L61"><code>storyboard.json</code> 的电报章节</a> 修改 <code>chapter.title</code>，例如把「摩尔斯电报」改为「电报传讯」，就能换掉纸带镜头上的章名。</p>
      </section>
    </div>
  </main>
