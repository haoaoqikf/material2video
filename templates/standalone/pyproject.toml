[project]
name = "standalone-video"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "playwright==1.63.0",
  "imageio-ffmpeg==0.6.0",
  "edge-tts==7.3.1",
  "pillow==13.0.0",
  "psutil==7.2.2",
  "fonttools==4.65.0",
  "pydantic==2.14.2"
]

[project.optional-dependencies]
# 本地中文配音；只有声明 tts.backend = "kokoro" 的作品需要安装。
kokoro = [
  "kokoro==0.9.4",
  "misaki[zh]==0.9.4"
]
# 本地声音克隆；只有声明 tts.backend = "qwen3-tts" 的作品需要安装。
qwen3-tts = [
  "qwen-tts==0.1.1",
  "stable-ts==2.19.1",
  "faster-whisper==1.2.1"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["runtime/python"]

[tool.setuptools.package-data]
"film_runtime.engine" = ["design_sample_viewer.html", "kokoro_voices.json"]
