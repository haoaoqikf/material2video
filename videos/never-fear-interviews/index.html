<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>永远不要害怕面试｜article2video</title>

<!--
  共享资源由 skill 提供，本页只负责视觉表达。
  引入顺序：base.css（画布与安全区）→ theme.css（设计令牌）→ figures.css（组件样式）
  → 页面样式，这样页面永远拥有最终覆盖权。
-->
<link rel="stylesheet" href="../../.agents/skills/article2video/assets/base.css">
<link rel="stylesheet" href="../../.agents/skills/article2video/assets/theme.css">
<link rel="stylesheet" href="../../.agents/skills/article2video/assets/figures.css">

<style>
  :root {
    --a2v-bg-0: #f1efea;
    --a2v-bg-1: #fbfaf7;
    --a2v-bg-2: #ffffff;
    --a2v-surface: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 100%);
    --a2v-surface-strong: linear-gradient(180deg, #ffffff 0%, #fdfbf7 100%);

    --a2v-text-1: #16181d;
    --a2v-text-2: rgba(22, 24, 29, 0.7);
    --a2v-text-3: rgba(22, 24, 29, 0.42);

    --a2v-accent: #c2352a;
    --a2v-accent-soft: rgba(194, 53, 42, 0.1);
    --a2v-accent-rgb: 194, 53, 42;

    --a2v-hairline: rgba(22, 24, 29, 0.12);
    --a2v-hairline-strong: rgba(22, 24, 29, 0.28);
    --a2v-inset-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.9);

    --a2v-shadow-1: 0 1px 2px rgba(30, 26, 22, 0.06);
    --a2v-shadow-2: 0 1px 2px rgba(30, 26, 22, 0.06), 0 18px 40px -28px rgba(30, 26, 22, 0.45);

    --a2v-font: "Songti SC", "SimSun", "Noto Serif SC", "Source Han Serif SC", serif;
    --a2v-font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;

    /* 图形语言：八幕共用同一套线宽与填充，浅底上用墨色、实心块上用亮色 */
    --fig-line: rgba(22, 24, 29, 0.4);
    --fig-line-soft: rgba(22, 24, 29, 0.16);
    --fig-ink: #2b2f38;
    --fig-on-ink: #ffffff;
    --fig-water: rgba(45, 78, 120, 0.16);
    --fig-water-line: rgba(45, 78, 120, 0.55);
    --fig-water-text: rgba(45, 78, 120, 0.75);

    /* 本片的进度轨：常驻在字幕之下，给纵向构图一个收口 */
    --rail-top: 1700px;
  }

  /*
   * 基础字体栈在 base.css 里是中文黑体，这里整页改用衬线：
   * 本片是「观点/口播」气质，衬线正文比黑体更接近杂志内页。
   * 标签、序号这类小字仍走无衬线，保证在手机上足够清晰。
   */
  body {
    font-family: var(--a2v-font);
    -webkit-font-smoothing: antialiased;
  }

  [data-a2v-stage] {
    background: var(--a2v-bg-0);
  }

  /* 层叠顺序：常驻背景（0）→ 场景与进度轨（1）。场景必须显式抬到背景之上。 */
  .stage-bg {
    z-index: 0;
  }

  [data-a2v-scene] {
    z-index: 1;
  }

  /* ---------- 常驻背景：暖光晕 + 纸纹细线 + 四角压暗 ---------- */
  .bg-bloom {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(58% 34% at 22% 8%, rgba(194, 53, 42, 0.075) 0%, rgba(194, 53, 42, 0) 70%),
      radial-gradient(64% 40% at 84% 96%, rgba(45, 78, 120, 0.07) 0%, rgba(45, 78, 120, 0) 72%),
      linear-gradient(180deg, #f7f5f1 0%, #efece6 100%);
  }

  /* 极细横纹：给浅色大色块一点纸张材质，避免「贴在纯色底上」的扁平感 */
  .bg-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    background-image: repeating-linear-gradient(
      180deg,
      rgba(22, 24, 29, 0.035) 0px,
      rgba(22, 24, 29, 0.035) 1px,
      rgba(22, 24, 29, 0) 1px,
      rgba(22, 24, 29, 0) 9px
    );
  }

  .bg-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(125% 88% at 50% 42%, rgba(22, 24, 29, 0) 52%, rgba(22, 24, 29, 0.09) 100%);
  }

  /* ---------- 场景角标：幕号 + 章节，让八幕读起来是一条线 ---------- */
  .scene-tag {
    position: absolute;
    top: 140px;
    left: var(--a2v-safe-x);
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: var(--a2v-font-sans);
    font-size: 30px;
    color: var(--a2v-text-3);
  }

  .scene-tag .tag-index {
    color: var(--a2v-accent);
    font-variant-numeric: tabular-nums;
  }

  .scene-tag .tag-rule {
    width: 64px;
    height: 1px;
    background: var(--a2v-hairline-strong);
  }

  /*
   * 正文区域比默认安全区略高：八幕里图形高度不一，
   * 给一点额外的纵向余量，避免长文案挤到字幕带上。
   */
  [data-a2v-scene] .a2v-safe {
    top: calc(var(--a2v-safe-top) + 20px);
    justify-content: center;
    gap: 56px;
  }

  /*
   * 双栏对照（第 07 幕）是本片最轻的一幕：组件默认的 1px 淡边框与白底
   * 在浅色主题里几乎看不见，整帧墨迹只有 0.24%，review 会判为「近似空幕」。
   * 这里给纸面加深、边框加实，让两栏成为真正的两个「选项」，
   * 而不是浮在浅底上的两块白。
   */
  [data-scene-id="danger"] {
    --a2v-bg-2: #f6f3ed;
    --vs-ink: #1d2026;
  }

  [data-scene-id="danger"] .vs-side {
    border: 2px solid rgba(22, 24, 29, 0.34);
    background: var(--a2v-surface-strong);
    box-shadow:
      var(--a2v-inset-highlight),
      0 2px 4px rgba(30, 26, 22, 0.1),
      0 26px 52px -30px rgba(30, 26, 22, 0.5);
  }

  [data-scene-id="danger"] .vs-side.is-left {
    background: linear-gradient(180deg, #ece7de 0%, #f4f1ea 100%);
  }

  [data-scene-id="danger"] .vs-side.is-left .vs-text {
    color: var(--vs-ink);
  }

  [data-scene-id="danger"] .vs-side.is-right {
    border-color: rgba(var(--a2v-accent-rgb), calc(0.5 + 0.45 * var(--vs-heat, 0)));
  }

  /* 浅底主题下 base.css 的白字字幕不可读，换成墨色 + 纸面底衬 */
  .a2v-subtitle {
    color: #ffffff;
    background: rgba(22, 24, 29, 0.82);
    border-radius: 20px;
    padding: 10px 26px;
    min-height: 0;
    text-shadow: none;
    font-family: var(--a2v-font-sans);
    font-weight: 500;
  }

  /* ---------- 进度轨：由帧号推导，常驻在字幕之下 ---------- */
  .progress-rail {
    position: absolute;
    top: var(--rail-top);
    left: var(--a2v-safe-x);
    right: var(--a2v-safe-x);
    z-index: 4;
    pointer-events: none;
    font-family: var(--a2v-font-sans);
  }

  .rail-track {
    position: relative;
    height: 2px;
    background: var(--a2v-hairline);
  }

  .rail-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 2px;
    width: 0;
    background: var(--a2v-accent);
    transform-origin: left center;
  }

  .rail-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 22px;
    font-size: 30px;
    letter-spacing: 0.16em;
    color: var(--a2v-text-3);
  }

  .rail-meta .rail-step {
    color: var(--a2v-text-2);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.12em;
  }

  /* 导出时预览控件由 base.css 隐藏；这里再兜一层，防止漏放类名 */
  html.a2v-rendering [data-a2v-controls] {
    display: none !important;
  }
</style>
</head>
<body>

<!--
  场景容器只保留结构，所有文案与图形标注都从 storyboard.json 注入。
  页面里不重复写一份文案，避免与分镜漂移；进度轨与角标由帧号算出，
  不使用 CSS 动画或时间函数，保证逐帧渲染可复现。
-->
<div data-a2v-stage>

  <!-- 常驻背景：暖光晕 + 纸纹细线 + 四角压暗，切换场景时保持不动 -->
  <div class="bg-bloom stage-bg" aria-hidden="true"></div>
  <div class="bg-lines stage-bg" aria-hidden="true"></div>
  <div class="bg-vignette stage-bg" aria-hidden="true"></div>

  <section data-a2v-scene data-scene-id="opening">
    <div class="scene-tag">
      <span class="tag-index">01</span>
      <span class="tag-rule"></span>
      <span>开场命题</span>
    </div>
    <div class="a2v-safe" data-a2v-figure></div>
  </section>

  <section data-a2v-scene data-scene-id="real-loss">
    <div class="scene-tag">
      <span class="tag-index">02</span>
      <span class="tag-rule"></span>
      <span>真正的损失</span>
    </div>
    <div class="a2v-safe" data-a2v-figure></div>
  </section>

  <section data-a2v-scene data-scene-id="fear-source">
    <div class="scene-tag">
      <span class="tag-index">03</span>
      <span class="tag-rule"></span>
      <span>恐惧的来源</span>
    </div>
    <div class="a2v-safe" data-a2v-figure></div>
  </section>

  <section data-a2v-scene data-scene-id="scene-loop">
    <div class="scene-tag">
      <span class="tag-index">04</span>
      <span class="tag-rule"></span>
      <span>反馈循环</span>
    </div>
    <div class="a2v-safe" data-a2v-figure></div>
  </section>

  <section data-a2v-scene data-scene-id="feedback-gain">
    <div class="scene-tag">
      <span class="tag-index">05</span>
      <span class="tag-rule"></span>
      <span>一份新信息</span>
    </div>
    <div class="a2v-safe" data-a2v-figure></div>
  </section>

  <section data-a2v-scene data-scene-id="upgrade">
    <div class="scene-tag">
      <span class="tag-index">06</span>
      <span class="tag-rule"></span>
      <span>上场的复利</span>
    </div>
    <div class="a2v-safe" data-a2v-figure></div>
  </section>

  <section data-a2v-scene data-scene-id="danger">
    <div class="scene-tag">
      <span class="tag-index">07</span>
      <span class="tag-rule"></span>
      <span>真正的危险</span>
    </div>
    <div class="a2v-safe" data-a2v-figure></div>
  </section>

  <section data-a2v-scene data-scene-id="closing">
    <div class="scene-tag">
      <span class="tag-index">08</span>
      <span class="tag-rule"></span>
      <span>收束</span>
    </div>
    <div class="a2v-safe" data-a2v-figure></div>
  </section>

  <!-- 进度轨：给下半幅一个稳定的收口，也是全片的时间坐标 -->
  <div class="progress-rail" aria-hidden="true">
    <div class="rail-track">
      <div class="rail-fill" data-rail-fill></div>
    </div>
    <div class="rail-meta">
      <span class="rail-step" data-rail-step>01 / 08</span>
      <span data-rail-label>开场命题</span>
    </div>
  </div>

</div>

<div data-a2v-controls class="a2v-preview-only">
  <button type="button" data-a2v-play>播放</button>
  <button type="button" data-a2v-replay>重播</button>
  <input type="range" data-a2v-seek min="0" max="1" value="0" aria-label="进度">
  <span data-a2v-time>0:00 / 0:00</span>
</div>

<!-- 弹簧求解器：timeline.js 的依赖（vendored 阻尼谐振子闭式解，wobble 1.5.1 · MIT） -->
<script src="../../.agents/skills/article2video/assets/vendor/spring.js"></script>
<script src="../../.agents/skills/article2video/assets/timeline.js"></script>
<script src="../../.agents/skills/article2video/assets/figures.js"></script>
<script>
(function () {
  'use strict';

  /*
   * 页面只负责「舞台 + 背景 + 每幕的挂载点 + 进度轨」，画面本身交给组件库。
   * 这里的映射是导演选择：一种内容形态默认用哪个组件。分镜在
   * data.figure.kind 里显式指定时以分镜为准，页面不参与二次判断。
   */
  var DEFAULT_FIGURES = {
    title: 'balance',
    quote: 'gap',
    comparison: 'versus',
    list: 'iceberg',
    diagram: 'loop',
    timeline: 'stairs',
    conclusion: 'exchange'
  };

  /** 章节名是画面的常驻标注，与分镜的场景一一对应，保持顺序即可。 */
  var CHAPTERS = {
    opening: '开场命题',
    'real-loss': '真正的损失',
    'fear-source': '恐惧的来源',
    'scene-loop': '反馈循环',
    'feedback-gain': '一份新信息',
    upgrade: '上场的复利',
    danger: '真正的危险',
    closing: '收束'
  };

  var rail = null;

  function pad2(value) {
    return value < 10 ? '0' + value : String(value);
  }

  /** 进度轨：当前幕号、章节名与全片进度，全部由帧号推导。 */
  function renderRail(state) {
    if (!rail) return;
    var scene = state.scene || {};
    var id = scene.id;
    var index = state.sceneIndex + 1;
    var total = state.sceneCount || 0;
    rail.step.textContent = pad2(index) + ' / ' + pad2(total);
    rail.label.textContent = CHAPTERS[id] || scene.type || '';
    var p = state.frame / Math.max(1, state.totalFrames - 1);
    rail.fill.style.transform = 'scaleX(' + p.toFixed(4) + ')';
  }

  /** 单帧渲染入口：由时间轴运行时按帧号调用，必须保持纯函数式。 */
  function renderFrame(state, api) {
    A2V.figures.renderScene(state, api, { defaults: DEFAULT_FIGURES });
    renderRail(state);
  }

  function collectRail() {
    rail = {
      fill: document.querySelector('[data-rail-fill]'),
      step: document.querySelector('[data-rail-step]'),
      label: document.querySelector('[data-rail-label]')
    };
    if (!rail.fill || !rail.step || !rail.label) rail = null;
  }

  A2V.fetchStoryboard('storyboard.json')
    .then(function (storyboard) {
      collectRail();
      A2V.mount({ storyboard: storyboard, render: renderFrame });
      return window.__A2V__.ready();
    })
    .catch(function (error) {
      // 出错时把原因写进画面，避免渲染出「全黑但成功」的视频
      document.body.innerHTML =
        '<pre style="font:28px/1.6 monospace;padding:80px;color:#a1231a">' +
        '网页启动失败：\n' + String(error && error.message ? error.message : error) +
        '\n\n如果是直接双击打开的 HTML，请改用本地服务器预览：\n' +
        'uv run python .agents/skills/article2video/scripts/preview.py videos/never-fear-interviews' +
        '</pre>';
      throw error;
    });
})();
</script>
</body>
</html>
