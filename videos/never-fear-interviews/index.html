<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>永远不要害怕面试｜article2video</title>

<!--
  共享资源由 skill 提供，本页只负责视觉表达。
  引入顺序：base.css（画布与安全区）→ theme.css（设计令牌）→ 页面样式，
  这样页面永远拥有最终覆盖权。
-->
<link rel="stylesheet" href="../../.agents/skills/article2video/assets/base.css">
<link rel="stylesheet" href="../../.agents/skills/article2video/assets/theme.css">

<style>
  /*
   * 本视频的视觉语言：浅色纸张底 + 墨黑文字 + 单一朱红强调。
   * 风格方向取自 references/visual-spec.md 的「编辑杂志」。
   *
   * 与上一版的区别是「以形表意」：每一幕都先给出一个会动的图形（天平、落差尺、
   * 冰山、飞轮、阶梯、双向箭头），文字只做图形的注脚。图形与动效配方见
   * references/visual-metaphor.md；所有数值都由 JS 按帧号写入，不使用 CSS 动画。
   */
  :root {
    /* 页面级令牌覆盖：只改颜色与表面，不改画布与安全区 */
    --a2v-bg-0: #f1efea;
    --a2v-bg-1: #fbfaf7;
    --a2v-bg-2: #ffffff;
    --a2v-surface: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 100%);
    --a2v-surface-strong: linear-gradient(180deg, #ffffff 0%, #fdfbf7 100%);

    --a2v-text-1: #16181d;
    --a2v-text-2: rgba(22, 24, 29, 0.7);
    --a2v-text-3: rgba(22, 24, 29, 0.42);

    --a2v-accent: #c2352a;
    --a2v-accent-soft: rgba(194, 53, 42, 0.1);
    --a2v-accent-rgb: 194, 53, 42;

    --a2v-hairline: rgba(22, 24, 29, 0.12);
    --a2v-hairline-strong: rgba(22, 24, 29, 0.28);
    --a2v-inset-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.9);

    /* 浅底上的投影要收敛：近处细、远处软，避免出现灰蒙蒙的一团 */
    --a2v-shadow-1: 0 1px 2px rgba(30, 26, 22, 0.06);
    --a2v-shadow-2: 0 1px 2px rgba(30, 26, 22, 0.06), 0 18px 40px -28px rgba(30, 26, 22, 0.45);

    --a2v-font: "Songti SC", "SimSun", "Noto Serif SC", "Source Han Serif SC", serif;
    --a2v-font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;

    /* 图形语言：所有插画共用三种线宽与两种填充，保证六幕看起来是一套画 */
    --fig-line: rgba(22, 24, 29, 0.4);
    --fig-line-soft: rgba(22, 24, 29, 0.16);
    --fig-ink: #2b2f38;
    --fig-water: rgba(45, 78, 120, 0.1);
  }

  /*
   * 基础字体栈在 base.css 里是中文黑体，这里整页改用衬线：
   * 本片是「观点/口播」气质，衬线正文比黑体更接近杂志内页。
   * 标签、序号这类小字仍走无衬线，保证在手机上足够清晰。
   */
  body {
    font-family: var(--a2v-font);
    -webkit-font-smoothing: antialiased;
  }

  [data-a2v-stage] {
    background: var(--a2v-bg-0);
  }

  /* 层叠顺序：常驻背景（0）→ 场景（1）。场景容器必须显式抬到背景之上。 */
  .stage-bg {
    z-index: 0;
  }

  [data-a2v-scene] {
    z-index: 1;
  }

  /* ---------- 常驻背景：暖光晕 + 纸纹细线 + 四角压暗 ---------- */
  .bg-bloom {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(58% 34% at 22% 8%, rgba(194, 53, 42, 0.075) 0%, rgba(194, 53, 42, 0) 70%),
      radial-gradient(64% 40% at 84% 96%, rgba(45, 78, 120, 0.07) 0%, rgba(45, 78, 120, 0) 72%),
      linear-gradient(180deg, #f7f5f1 0%, #efece6 100%);
  }

  /* 极细横纹：给浅色大色块一点纸张材质，避免「贴在纯色底上」的扁平感 */
  .bg-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    background-image: repeating-linear-gradient(
      180deg,
      rgba(22, 24, 29, 0.035) 0px,
      rgba(22, 24, 29, 0.035) 1px,
      rgba(22, 24, 29, 0) 1px,
      rgba(22, 24, 29, 0) 9px
    );
  }

  .bg-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(125% 88% at 50% 42%, rgba(22, 24, 29, 0) 52%, rgba(22, 24, 29, 0.09) 100%);
  }

  /* ---------- 通用：场景角标、强调短语、图形基线 ---------- */
  .scene-tag {
    position: absolute;
    top: 140px;
    left: var(--a2v-safe-x);
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: var(--a2v-font-sans);
    font-size: 30px;
    color: var(--a2v-text-3);
  }

  .scene-tag .tag-index {
    color: var(--a2v-accent);
    font-variant-numeric: tabular-nums;
  }

  .scene-tag .tag-rule {
    width: 64px;
    height: 1px;
    background: var(--a2v-hairline-strong);
  }

  .key {
    color: var(--a2v-accent);
    white-space: nowrap;
  }

  /* 逐字揭示产生的单字节点（结论幕使用） */
  .reveal-char {
    display: inline-block;
    white-space: pre;
  }

  .reveal-char.is-break {
    display: block;
    height: 0;
  }

  /* ---------- 图形通用：六幕共用同一套线宽与圆角，看起来才像一套画 ---------- */
  .fig {
    display: block;
    width: 888px;
    margin: 0 auto;
    overflow: visible;
  }

  .fig text {
    font-family: var(--a2v-font);
    dominant-baseline: middle;
  }

  .fig .ln {
    fill: none;
    stroke: var(--fig-line);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .fig .ln-soft {
    stroke: var(--fig-line-soft);
  }

  .fig .ln-accent {
    stroke: var(--a2v-accent);
  }

  .fig .dashed {
    stroke-dasharray: 16 14;
  }

  .fig .paper {
    fill: #ffffff;
    stroke: var(--fig-line);
    stroke-width: 4;
  }

  .section-title {
    font-family: var(--a2v-font-sans);
    font-size: 36px;
    font-weight: 500;
    letter-spacing: 0.14em;
    color: var(--a2v-text-3);
    margin: 0;
  }

  /* ---------- 01 开场：天平 ---------- */
  [data-scene-id="opening"] .a2v-safe {
    justify-content: center;
    gap: 30px;
  }

  .title-text {
    font-size: 124px;
    line-height: 1.16;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.03em;
    /* 断行位置由分镜里的换行符决定，避免自动折行把重点词拆开 */
    white-space: pre-line;
    /* 上深下浅的墨色渐变：比纯黑多一点纸面呼吸感 */
    background: linear-gradient(180deg, #23262d 0%, #3d434e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .title-sub {
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .title-sub-line {
    font-size: 44px;
    line-height: 1.45;
    color: var(--a2v-text-2);
  }

  .fig-scale {
    width: 888px;
    height: 430px;
    overflow: visible;
  }

  .scale-pivot {
    fill: var(--fig-line);
  }

  .scale-plate {
    fill: #ffffff;
    stroke: var(--fig-line);
    stroke-width: 4;
    stroke-linejoin: round;
  }

  .scale-rope {
    fill: none;
    stroke: var(--fig-line-soft);
    stroke-width: 4;
  }

  .load-solid {
    fill: var(--fig-ink);
  }

  /* 空壳：虚线 + 极浅填充，表示「看着很大，其实没有重量」 */
  .load-hollow {
    fill: rgba(22, 24, 29, 0.035);
    stroke: var(--fig-line);
    stroke-width: 4;
    stroke-dasharray: 16 13;
  }

  .load-token {
    fill: #ffffff;
    stroke: var(--fig-line);
    stroke-width: 4;
  }

  .load-text {
    font-size: 36px;
    text-anchor: middle;
    letter-spacing: 0.06em;
    fill: #ffffff;
  }

  .load-text.is-ink {
    fill: var(--a2v-text-2);
  }

  /*
   * 光晕必须引用本幕自己的渐变：跨场景引用另一个 <defs> 里的 id 在
   * 目标场景被 display:none 时不会解析，光晕会静默消失。
   */
  .scale-halo {
    fill: url(#scale-halo);
  }

  /* ---------- 02 金句：落差尺 ---------- */
  [data-scene-id="real-loss"] .a2v-safe {
    justify-content: center;
    gap: 46px;
  }

  .quote-block {
    position: relative;
    padding-left: 62px;
    color: var(--a2v-text-1);
  }

  /* 引号退到文字之后，作为装饰而不是内容 */
  .quote-mark {
    position: absolute;
    top: -104px;
    left: -8px;
    font-size: 220px;
    line-height: 1;
    color: var(--a2v-accent);
    opacity: 0;
    pointer-events: none;
    font-family: var(--a2v-font);
  }

  /* 左侧强调竖线：先于文字画出，给整句一个「引文」的框架 */
  .quote-rule {
    position: absolute;
    left: 0;
    top: 10px;
    bottom: 10px;
    width: 6px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--a2v-accent) 0%, rgba(194, 53, 42, 0.1) 100%);
    transform-origin: top center;
  }

  /*
   * 字号按硬换行反推：文字可用宽度 = 1080 - 2 × 96 = 888px。
   * 最长一行是「不过就是这家公司不要你。」共 14 字（含标点），衬线单字宽约为
   * 字号的 1.02 倍，因此取 62px 并让每行都留有余量——宁可缩小字号，
   * 也不要让浏览器把分镜里的硬换行再折成第四行。
   */
  .quote-text {
    font-size: 62px;
    line-height: 1.55;
    font-weight: 600;
    margin: 0;
    max-width: 888px;
    overflow-wrap: normal;
    white-space: pre-line;
  }

  /*
   * 强调短语：颜色 + 底部一条短横线，比加粗更克制。
   * 底横线用单独的元素而不是 ::after —— 伪元素无法按帧改样式，
   * 逐帧渲染下只能靠 JS 写内联值，因此这里是真实节点。
   */
  .quote-text .key {
    position: relative;
    display: inline-block;
  }

  .key-underline {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 2px;
    height: 6px;
    border-radius: 999px;
    background: var(--a2v-accent);
    transform: scaleX(0);
    transform-origin: left center;
    pointer-events: none;
  }

  .drop-board {
    display: flex;
    justify-content: space-between;
    gap: 40px;
  }

  .drop-panel {
    position: relative;
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 26px 20px 24px;
    border: 1px solid var(--a2v-hairline);
    border-radius: var(--a2v-radius-lg);
    background: var(--a2v-surface), var(--a2v-bg-2);
    box-shadow: var(--a2v-inset-highlight), var(--a2v-shadow-2);
  }

  /* 只有「事实」那一栏拿强调色：它在画面里是焦点 */
  .drop-panel.is-fact {
    border-color: rgba(var(--a2v-accent-rgb), 0.42);
    background: var(--a2v-surface-strong);
  }

  .drop-cap {
    font-family: var(--a2v-font-sans);
    font-size: 32px;
    letter-spacing: 0.08em;
    color: var(--a2v-text-3);
    text-align: center;
  }

  .drop-panel.is-fact .drop-cap {
    color: var(--a2v-accent);
  }

  .drop-stage {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 44px;
    height: 300px;
  }

  /* 竖尺：底边是「0」，高度是「你手里有的东西」 */
  .drop-track {
    position: relative;
    width: 104px;
    height: 268px;
    border: 1px solid var(--a2v-hairline);
    border-radius: var(--a2v-radius-sm);
    background: rgba(22, 24, 29, 0.025);
  }

  .drop-fill {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 0;
    border-radius: 0 0 19px 19px;
    background: linear-gradient(180deg, #3a3f4a 0%, #23262d 100%);
  }

  .drop-panel.is-fact .drop-fill {
    background: linear-gradient(180deg, #cc4a3f 0%, #a92c22 100%);
  }

  /* 虚线：被拒绝之前的高度。它留在原地，差值就是「失去」 */
  .drop-ghost {
    position: absolute;
    left: -1px;
    right: -1px;
    bottom: -1px;
    height: 0;
    border: 2px dashed var(--fig-line);
    border-bottom: 0;
    border-radius: 19px 19px 0 0;
  }

  .drop-zero {
    position: absolute;
    left: -14px;
    right: -14px;
    bottom: -3px;
    height: 3px;
    background: var(--fig-line);
  }

  /* 落差括号：从「现在」量到「曾经」，长度就是真正的损失 */
  .drop-bracket-wrap {
    position: relative;
    width: 148px;
    height: 268px;
  }

  .drop-bracket {
    position: absolute;
    left: 34px;
    width: 22px;
    height: 0;
    border-left: 4px solid var(--a2v-accent);
  }

  .drop-bracket::before,
  .drop-bracket::after {
    content: "";
    position: absolute;
    left: 0;
    width: 22px;
    height: 4px;
    background: var(--a2v-accent);
  }

  .drop-bracket::before {
    top: 0;
  }

  .drop-bracket::after {
    bottom: 0;
  }

  .drop-bracket.is-flat {
    border-left-color: var(--a2v-text-3);
  }

  .drop-bracket.is-flat::before,
  .drop-bracket.is-flat::after {
    background: var(--a2v-text-3);
  }

  .drop-label {
    position: absolute;
    left: 60px;
    width: 124px;
    font-family: var(--a2v-font-sans);
    font-size: 30px;
    line-height: 1.25;
    /* 标注一律单行：换行会把「无可失去」挤成两截，读起来像两个词 */
    white-space: nowrap;
    color: var(--a2v-accent);
  }

  .drop-label.is-flat {
    color: var(--a2v-text-2);
  }

  /* ---------- 03 恐惧来源：冰山 ---------- */
  [data-scene-id="fear-source"] .a2v-safe {
    justify-content: center;
    gap: 24px;
  }

  .fig-berg {
    width: 888px;
    height: 760px;
    overflow: visible;
  }

  .berg-water {
    /* 越深越淡：让水体下缘自然消失，而不是切出一条硬边 */
    fill: url(#berg-depth);
  }

  .berg-tip {
    fill: #ffffff;
    stroke: var(--fig-line);
    stroke-width: 4;
    stroke-linejoin: round;
  }

  /* 水下部分用冷色 + 虚线：它是被藏起来的那一半 */
  .berg-mass {
    fill: rgba(45, 78, 120, 0.16);
    stroke: rgba(45, 78, 120, 0.55);
    stroke-width: 4;
    stroke-linejoin: round;
    stroke-dasharray: 18 14;
  }

  .berg-callout {
    fill: #ffffff;
    stroke: var(--a2v-hairline);
    stroke-width: 2;
  }

  .berg-callout.is-accent {
    stroke: rgba(var(--a2v-accent-rgb), 0.5);
  }

  .berg-callout-label {
    font-size: 44px;
    font-weight: 700;
    fill: var(--a2v-text-1);
    letter-spacing: 0.02em;
  }

  .berg-callout-label.is-accent {
    fill: var(--a2v-accent);
  }

  .berg-callout-desc {
    font-family: var(--a2v-font-sans);
    font-size: 30px;
    fill: var(--a2v-text-2);
  }

  .berg-link {
    fill: none;
    stroke: var(--fig-line);
    stroke-width: 3;
    stroke-dasharray: 10 10;
  }

  .berg-link.is-accent {
    stroke: rgba(var(--a2v-accent-rgb), 0.7);
  }

  .berg-spark {
    fill: var(--a2v-accent);
  }

  .berg-surface-note {
    font-family: var(--a2v-font-sans);
    font-size: 30px;
    fill: rgba(45, 78, 120, 0.75);
    letter-spacing: 0.14em;
  }

  /* ---------- 04 反馈循环：飞轮 ---------- */
  [data-scene-id="feedback-loop"] .a2v-safe {
    gap: 22px;
  }

  .fig-loop {
    width: 888px;
    height: 560px;
    overflow: visible;
  }

  .loop-track {
    fill: none;
    stroke: var(--fig-line-soft);
    stroke-width: 4;
    stroke-dasharray: 4 18;
    stroke-linecap: round;
  }

  .loop-arc {
    fill: none;
    stroke: var(--a2v-accent);
    stroke-width: 6;
    stroke-linecap: round;
  }

  .loop-node-disc {
    fill: #ffffff;
    stroke: var(--fig-line);
    stroke-width: 4;
  }

  .loop-node-shadow {
    fill: rgba(30, 26, 22, 0.07);
  }

  .loop-node-text {
    font-size: 48px;
    font-weight: 600;
    text-anchor: middle;
    fill: var(--a2v-text-1);
    letter-spacing: 0.04em;
  }

  .loop-token {
    fill: var(--a2v-accent);
  }

  .loop-token-halo {
    fill: url(#loop-halo);
  }

  .gauge {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 6px;
  }

  .gauge-label {
    font-family: var(--a2v-font-sans);
    font-size: 32px;
    letter-spacing: 0.14em;
    color: var(--a2v-text-3);
    white-space: nowrap;
  }

  .gauge-track {
    position: relative;
    flex: 1 1 auto;
    height: 16px;
    border-radius: 999px;
    background: rgba(22, 24, 29, 0.07);
    overflow: hidden;
  }

  .gauge-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(194, 53, 42, 0.55) 0%, #c2352a 100%);
  }

  /* ---------- 05 上场复利：阶梯 ---------- */
  [data-scene-id="upgrade"] .a2v-safe {
    justify-content: center;
    gap: 30px;
  }

  .fig-stairs {
    width: 888px;
    height: 640px;
    overflow: visible;
  }

  .stair-bar {
    fill: #ffffff;
    stroke: var(--fig-line);
    stroke-width: 4;
  }

  .stair-bar.is-focus {
    fill: rgba(194, 53, 42, 0.09);
    stroke: var(--a2v-accent);
  }

  .stair-base {
    stroke: var(--fig-line);
    stroke-width: 4;
  }

  .stair-axis {
    stroke: var(--fig-line-soft);
    stroke-width: 3;
  }

  .stair-note {
    font-family: var(--a2v-font-sans);
    font-size: 32px;
    text-anchor: middle;
    fill: var(--a2v-text-3);
    letter-spacing: 0.1em;
  }

  .stair-note.is-focus {
    fill: var(--a2v-accent);
  }

  .stair-label {
    font-size: 38px;
    font-weight: 600;
    text-anchor: middle;
    fill: var(--a2v-text-1);
  }

  .stair-axis-label {
    font-family: var(--a2v-font-sans);
    font-size: 30px;
    fill: var(--a2v-text-3);
    letter-spacing: 0.12em;
  }

  .stair-marker {
    fill: var(--a2v-accent);
  }

  .stair-marker-halo {
    fill: url(#stair-halo);
  }

  .stair-caption {
    font-size: 40px;
    line-height: 1.3;
    color: var(--a2v-text-1);
    text-align: center;
    min-height: 52px;
  }

  .stair-flip {
    align-self: center;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 34px;
    border: 1px solid var(--a2v-hairline);
    border-radius: 999px;
    background: var(--a2v-surface), var(--a2v-bg-2);
    box-shadow: var(--a2v-inset-highlight), var(--a2v-shadow-1);
    font-family: var(--a2v-font-sans);
    font-size: 32px;
    letter-spacing: 0.08em;

<script>
(function () {
  'use strict';

  var SVG_NS = 'http://www.w3.org/2000/svg';

  /* 时间只走三条曲线：出场 outQuint、双向变化 inOutCubic、逐项门控 outCubic。
     混用更多曲线会让画面显得杂，详见 references/visual-spec.md。 */
  var EASE_OUT = 'outQuint';
  var EASE_SOFT = 'outCubic';
  var EASE_SYMMETRIC = 'inOutCubic';

  /* ---------------- 通用工具 ---------------- */

  /** 在当前场景容器内按 data-el 名称取元素。 */
  function pick(state, name) {
    var scene = document.querySelector('[data-a2v-scene][data-scene-id="' + state.scene.id + '"]');
    return scene ? scene.querySelector('[data-el="' + name + '"]') : null;
  }

  function escapeHtml(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /**
   * 把分镜里的重点短语包成强调样式。
   * 只替换第一处出现，避免同一短语在句中多处被点亮而分散注意力。
   * underline 为 true 时额外挂一条按帧画出的底横线（金句幕用）。
   */
  function emphasize(text, phrases, underline) {
    var html = escapeHtml(text);
    (phrases || []).forEach(function (phrase) {
      var safe = escapeHtml(phrase);
      if (safe && html.indexOf(safe) !== -1) {
        html = html.replace(
          safe,
          '<span class="key">' + safe + (underline ? '<span class="key-underline"></span>' : '') + '</span>'
        );
      }
    });
    return html;
  }

  /** 文本类场景的统一写法：内容来自分镜，样式类由页面决定。 */
  function setText(node, value, emphasis, underline) {
    if (!node) {
      return;
    }
    var next = emphasize(value, emphasis, underline);
    if (node.innerHTML !== next) {
      node.innerHTML = next;
    }
  }

  /** 按帧号取「场景内的某个进度点」：用比例而不是绝对帧，场景被配音拉长后节奏不变。 */
  function beat(state, fraction) {
    return fraction * state.sceneDurationFrames;
  }

  /** 给 SVG 元素写 transform 属性（SVG 用属性而不是 CSS 变量，避免布局抖动）。 */
  function svgT(node, tx, ty, rotate, scale) {
    if (!node) {
      return;
    }
    var value = 'translate(' + tx.toFixed(2) + ' ' + ty.toFixed(2) + ')';
    if (rotate) {
      value += ' rotate(' + rotate.toFixed(4) + ')';
    }
    if (scale !== undefined && scale !== null) {
      value += ' scale(' + scale.toFixed(4) + ')';
    }
    node.setAttribute('transform', value);
  }

  function svgO(node, value) {
    if (node) {
      node.setAttribute('opacity', String(value < 0 ? 0 : value > 1 ? 1 : value));
    }
  }

  function svgEl(name, attrs) {
    var node = document.createElementNS(SVG_NS, name);
    Object.keys(attrs || {}).forEach(function (key) {
      node.setAttribute(key, attrs[key]);
    });
    return node;
  }

  function clearNode(node) {
    while (node && node.firstChild) {
      node.removeChild(node.firstChild);
    }
  }

  /** 只在内容变化时重建结构：签名一致就跳过，保证同一帧永远得到同一棵 DOM。 */
  function buildOnce(host, signature, build) {
    if (!host || host.dataset.built === signature) {
      return false;
    }
    host.dataset.built = signature;
    clearNode(host);
    build(host);
    return true;
  }

  /**
   * HTML 元素的入场 + 常驻微动。
   *
   * 配音会把场景拉长，入场动画结束后画面若完全静止，成片会显得卡住；
   * 这里在末段用 api.breath 叠一点极小位移，并用同一个 settle 值把缩放钉在 1。
   */
  function enterAlive(state, api, el, p, options) {
    if (!el) {
      return;
    }
    var o = options || {};
    var from = api.spring(p, { damping: 6, frequency: 1.1 });
    var settle = api.progress(state.localFrame, beat(state, 0.24), 36, EASE_SYMMETRIC);
    var shift = (1 - from) * (o.distance === undefined ? 44 : o.distance);
    var axis = o.axis || 'y';
    var drift = api.breath(state.localFrame, {
      periodFrames: o.periodFrames || 130,
      amplitude: o.amplitude === undefined ? 3 : o.amplitude,
      phase: o.phase || 0
    }) * settle;
    el.style.transform =
      'translate3d(' + (axis === 'x' ? shift : 0).toFixed(2) + 'px,' +
      ((axis === 'y' ? shift : 0) + drift).toFixed(2) + 'px,0) scale(' +
      api.range(from, o.scale === undefined ? 1 : o.scale, 1, { clamp: false }).toFixed(4) + ')';
    el.style.opacity = String(api.clamp(from, 0, 1) * (o.opacity === undefined ? 1 : o.opacity));
  }

  /** SVG 分组的入场（同上，但写的是 SVG transform 属性）。 */
  function enterFig(state, api, node, p, options) {
    if (!node) {
      return;
    }
    var o = options || {};
    var from = api.spring(p, { damping: 6, frequency: 1.1 });
    var settle = api.progress(state.localFrame, beat(state, 0.24), 36, EASE_SYMMETRIC);
    var shift = (1 - from) * (o.distance === undefined ? 40 : o.distance);
    var axis = o.axis || 'y';
    var drift = api.breath(state.localFrame, {
      periodFrames: o.periodFrames || 140,
      amplitude: o.amplitude === undefined ? 2.5 : o.amplitude,
      phase: o.phase || 0
    }) * settle;
    svgT(
      node,
      axis === 'x' ? shift : 0,
      (axis === 'y' ? shift : 0) + drift,
      0,
      api.range(from, o.scale === undefined ? 1 : o.scale, 1, { clamp: false })
    );
    svgO(node, api.clamp(from, 0, 1));
  }

  /** 与运行时语义一致的钳制，避免为一个小工具再暴露一层接口。 */
  function clampStatic(value, min, max) {
    return value < min ? min : value > max ? max : value;
  }

  /* ---------------- 01 天平 ---------------- */

  /* 几何常量：位置全部由常量算出，不读取布局，因此逐帧稳定。 */
  var SCALE = {
    PIVOT_X: 444,
    PIVOT_Y: 96,
    ARM: 300,
    TILT: -9
  };

  /** 横梁倾角 → 两个吊盘挂点的坐标（吊盘始终垂直，靠平移跟随横梁端点）。 */
  function panAnchors(theta) {
    var rad = (theta * Math.PI) / 180;
    var cos = Math.cos(rad);
    var sin = Math.sin(rad);
    return {
      left: {
        x: SCALE.PIVOT_X - SCALE.ARM * cos,
        y: SCALE.PIVOT_Y - SCALE.ARM * sin
      },
      right: {
        x: SCALE.PIVOT_X + SCALE.ARM * cos,
        y: SCALE.PIVOT_Y + SCALE.ARM * sin
      }
    };
  }

  /**
   * 开场：先把「害怕」压下去，再证明它只是个空壳。
   *
   * 天平的左盘放上「命运的考试」时明显下沉（恐惧的重量），随后那块重物变成虚线
   * 空壳、横梁弹回水平；右盘「一次上场」亮起强调色，同时标题里的「害怕」褪回墨色。
   * 颜色本身就是叙事：恐惧退场，动作上场。
   */
  function renderOpening(state, api) {
    var f = state.localFrame;
    var data = state.scene.data;
    var ann = data.annotations || {};

    var title = pick(state, 'text');
    var sub1 = pick(state, 'sub1');
    var sub2 = pick(state, 'sub2');
    var lines = String(data.subtitle || '').split('\n');

    setText(title, data.text, data.emphasis, false);
    if (sub1) {
      sub1.textContent = lines[0] || '';
    }
    if (sub2) {
      sub2.textContent = lines[1] || '';
    }
    setPlainText(pick(state, 'loadLeftText'), ann.leftPan);
    setPlainText(pick(state, 'loadLeftTextHollow'), ann.leftPan);
    setPlainText(pick(state, 'loadRightText'), ann.rightPan);

    enterAlive(state, api, title, api.progress(f, beat(state, 0.03), 28, EASE_OUT), {
      distance: 58,
      amplitude: 4
    });
    enterAlive(state, api, sub1, api.progress(f, beat(state, 0.46), 24, EASE_OUT), {
      distance: 24,
      amplitude: 3,
      periodFrames: 150,
      phase: 20
    });
    enterAlive(state, api, sub2, api.progress(f, beat(state, 0.7), 24, EASE_OUT), {
      distance: 24,
      amplitude: 3,
      periodFrames: 150,
      phase: 60
    });

    // 支架：立柱自下而上画出，底座与斜撑随后
    api.drawPath(pick(state, 'pillar'), api.progress(f, beat(state, 0.15), 26, EASE_OUT), { length: 276 });
    api.drawPath(pick(state, 'legL'), api.progress(f, beat(state, 0.22), 20, EASE_OUT), { length: 88 });
    api.drawPath(pick(state, 'legR'), api.progress(f, beat(state, 0.22), 20, EASE_OUT), { length: 88 });
    api.drawPath(pick(state, 'base'), api.progress(f, beat(state, 0.24), 20, EASE_OUT), { length: 160 });
    svgO(pick(state, 'pivot'), api.progress(f, beat(state, 0.24), 18, EASE_OUT));

    // 倾角：恐惧压下左盘 → 看穿空壳 → 弹回水平
    var press = api.progress(f, beat(state, 0.42), beat(state, 0.14), EASE_SYMMETRIC);
    var relief = api.spring(api.progress(f, beat(state, 0.62), beat(state, 0.16), EASE_SYMMETRIC), {
      damping: 5,
      frequency: 1.5
    });
    var theta = SCALE.TILT * press * (1 - relief);
    var anchors = panAnchors(theta);

    var beamP = api.progress(f, beat(state, 0.25), 26, EASE_OUT);
    var beamSettle = api.progress(f, beat(state, 0.7), 40, EASE_SYMMETRIC);
    var beamDrift = api.breath(f, { periodFrames: 150, amplitude: 2 }) * beamSettle;
    svgT(
      pick(state, 'beam'),
      SCALE.PIVOT_X,
      SCALE.PIVOT_Y + beamDrift,
      theta,
      api.range(api.spring(beamP, { damping: 6, frequency: 1.2 }), 0.55, 1, { clamp: false })
    );
    svgO(pick(state, 'beam'), beamP);

    // 吊盘：跟着横梁端点平移，落位后保持垂直
    var panP = api.spring(api.progress(f, beat(state, 0.28), 24, EASE_OUT), { damping: 6, frequency: 1.2 });
    var panSettle = api.progress(f, beat(state, 0.28), 40, EASE_SYMMETRIC);
    var dropIn = (1 - panP) * 60;
    var driftL = api.breath(f, { periodFrames: 150, amplitude: 2.4 }) * panSettle;
    var driftR = api.breath(f, { periodFrames: 150, amplitude: 2.4, phase: 50 }) * panSettle;
    svgT(pick(state, 'panLeft'), anchors.left.x, anchors.left.y + dropIn + driftL);
    svgO(pick(state, 'panLeft'), api.clamp(panP * 1.5, 0, 1));
    svgT(pick(state, 'panRight'), anchors.right.x, anchors.right.y + dropIn + driftR);
    svgO(pick(state, 'panRight'), api.clamp(panP * 1.5, 0, 1));

    // 左盘的重物落下
    var loadP = api.spring(api.progress(f, beat(state, 0.34), 26, EASE_OUT), { damping: 5.5, frequency: 1.3 });
    var loadDrop = (1 - loadP) * -170;
    var reveal = api.progress(f, beat(state, 0.54), beat(state, 0.16), EASE_SYMMETRIC);
    svgO(pick(state, 'loadLeft'), api.clamp(loadP, 0, 1));
    svgT(pick(state, 'loadLeft'), 0, loadDrop, 0, 1 - reveal * 0.06);
    svgO(pick(state, 'loadLeftSolid'), 1 - reveal);
    svgO(pick(state, 'loadLeftHollow'), reveal);

    // 右盘的「一次上场」：轻，但它是最后亮起来的那一个
    var tokenP = api.spring(api.progress(f, beat(state, 0.3), 24, EASE_OUT), { damping: 5.5, frequency: 1.3 });
    svgO(pick(state, 'loadRight'), api.clamp(tokenP, 0, 1));
    svgT(pick(state, 'loadRight'), 0, (1 - tokenP) * -120, 0, api.range(tokenP, 0.9, 1, { clamp: false }));

    var glow = api.progress(f, beat(state, 0.66), beat(state, 0.16), EASE_SYMMETRIC);
    var halo = pick(state, 'rightHalo');
    var haloScale = api.range(glow, 0.6, 1.1, { clamp: false });
    // 光晕以自身圆心缩放，否则缩放会把圆心一起拖走
    svgT(halo, 0, 127 * (1 - haloScale), 0, haloScale);
    svgO(halo, glow * 0.85);
    var rect = pick(state, 'loadRightRect');
    if (rect) {
      rect.setAttribute('stroke', 'rgba(194, 53, 42, ' + (0.28 + 0.62 * glow).toFixed(3) + ')');
    }
    // 文字用内联 style 而不是 SVG 属性：CSS 类会盖过表现属性，属性写不进去
    var tokenText = pick(state, 'loadRightText');
    if (tokenText) {
      tokenText.style.fill =
        'rgb(' + Math.round(api.range(glow, 64, 194)) + ',' +
        Math.round(api.range(glow, 68, 53)) + ',' +
        Math.round(api.range(glow, 74, 42)) + ')';
    }

    // 标题里的「害怕」随空壳一起褪色：恐惧退场，动作上场
    var key = title ? title.querySelector('.key') : null;
    if (key) {
      var cool = api.progress(f, beat(state, 0.62), beat(state, 0.16), EASE_SYMMETRIC);
      key.style.color =
        'rgb(' + Math.round(api.range(cool, 194, 35)) + ',' +
        Math.round(api.range(cool, 53, 38)) + ',' +
        Math.round(api.range(cool, 42, 45)) + ')';
    }
  }

  function setPlainText(node, value) {
    if (node) {
      node.textContent = value == null ? '' : String(value);
    }
  }

  /* ---------------- 02 落差尺 ---------------- */

  var TRACK_H = 268;

  /**
   * 金句：把「失去」画成一截可测量的落差。
   *
   * 左边先演一遍恐惧的剧本——拥有、被拿走、落差拉满；右边才是事实：柱子里本来就
   * 没有东西，括号塌成一条贴着 0 的短线。两栏共用同一把竖尺，观众可以自己比。
   */
  function renderLoss(state, api) {
    var f = state.localFrame;
    var data = state.scene.data;
    var ann = data.annotations || {};
    var text = pick(state, 'text');
    var rule = pick(state, 'rule');
    var mark = pick(state, 'mark');

    setText(text, data.text, data.emphasis, true);
    setPlainText(pick(state, 'capA'), ann.assumption);
    setPlainText(pick(state, 'capB'), ann.fact);
    setPlainText(pick(state, 'labelA'), ann.dropLabel);
    setPlainText(pick(state, 'labelB'), ann.noDropLabel);

    if (rule) {
      var ruleP = api.progress(f, 0, 20, EASE_OUT);
      rule.style.transform = 'scaleY(' + ruleP.toFixed(4) + ')';
      rule.style.opacity = String(ruleP);
    }
    if (mark) {
      var markP = api.progress(f, beat(state, 0.02), 24, EASE_OUT);
      mark.style.opacity = String(markP * 0.14);
      mark.style.transform = 'translateY(' + api.range(markP, -26, 0).toFixed(1) + 'px)';
    }

    enterAlive(state, api, text, api.progress(f, beat(state, 0.04), 28, EASE_OUT), {
      distance: 50,
      amplitude: 3
    });
    enterAlive(state, api, pick(state, 'panelA'), api.progress(f, beat(state, 0.16), 24, EASE_OUT), {
      distance: 40,
      amplitude: 2.5,
      phase: 0
    });
    enterAlive(state, api, pick(state, 'panelB'), api.progress(f, beat(state, 0.22), 24, EASE_OUT), {
      distance: 40,
      amplitude: 2.5,
      phase: 40
    });

    // 左边：拥有 → 被拿走 → 落差拉满
    var ownP = api.progress(f, beat(state, 0.26), beat(state, 0.09), EASE_OUT);
    var dropP = api.progress(f, beat(state, 0.38), beat(state, 0.08), EASE_SYMMETRIC);
    var aFill = ownP * (1 - dropP);
    var aGhost = ownP;
    applyDrop(pick(state, 'fillA'), aFill);
    applyDrop(pick(state, 'ghostA'), aGhost);

    var gapP = api.progress(f, beat(state, 0.48), beat(state, 0.1), EASE_SYMMETRIC);
    placeBracket(pick(state, 'bracketA'), pick(state, 'labelA'), aFill, (aGhost - aFill) * gapP, false);

    // 右边：本来就没有，所以没有可失去的
    applyDrop(pick(state, 'fillB'), 0);
    applyDrop(pick(state, 'ghostB'), 0);
    var flatP = api.progress(f, beat(state, 0.56), beat(state, 0.1), EASE_SYMMETRIC);
    var bracketB = pick(state, 'bracketB');
    var labelB = pick(state, 'labelB');
    placeBracket(bracketB, labelB, 0, flatP * 0.012, true);
    if (bracketB) {
      bracketB.style.opacity = String(flatP);
    }
    if (labelB) {
      labelB.style.opacity = String(flatP);
    }

    // 左边淡出为「假设」：它只是观众脑内的剧本，不是事实
    var panelA = pick(state, 'panelA');
    if (panelA) {
      var fade = api.progress(f, beat(state, 0.54), beat(state, 0.14), EASE_SYMMETRIC);
      panelA.style.opacity = String(1 - fade * 0.55);
    }

    // 关键短语：底横线在句子读完后画出，颜色同步加深
    var key = text ? text.querySelector('.key') : null;
    if (key) {
      var highlight = api.progress(f, beat(state, 0.7), beat(state, 0.1), EASE_SYMMETRIC);
      var underline = key.querySelector('.key-underline');
      if (underline) {
        underline.style.transform = 'scaleX(' + highlight.toFixed(4) + ')';
      }
      key.style.textShadow =
        '0 0 ' + api.range(highlight, 0, 26).toFixed(1) + 'px rgba(var(--a2v-accent-rgb), ' +
        api.range(highlight, 0, 0.22).toFixed(3) + ')';
    }
  }

  /** 竖尺填充：高度按比例写，圆角底部保持贴地。 */
  function applyDrop(node, ratio) {
    if (node) {
      node.style.height = (clampStatic(ratio, 0, 1) * TRACK_H).toFixed(1) + 'px';
    }
  }

  /**
   * 落差括号：从「现在还剩多少」量到「曾经有多少」。
   * flat 为真时（本来就没有）把括号压成贴着 0 线的一小段，标签跟在它右边，
   * 这样「失去全部」和「无可失去」在同一把尺上可以直接比长度。
   */
  function placeBracket(bracket, label, fillRatio, gapRatio, flat) {
    var top = clampStatic(fillRatio, 0, 1) * TRACK_H;
    var height = clampStatic(gapRatio, 0, 1) * TRACK_H;
    if (flat) {
      top = TRACK_H - 6;
      height = 6;
    }
    if (bracket) {
      bracket.style.top = top.toFixed(1) + 'px';
      bracket.style.height = height.toFixed(1) + 'px';
    }
    if (label) {
      var center = flat ? TRACK_H : top + height / 2;
      label.style.top = (clampStatic(center, 44, TRACK_H - 16) - 20).toFixed(1) + 'px';
    }
  }

  /* ---------------- 03 冰山 ---------------- */

  var BERG = {
    CALLOUT_X: 452,
    CALLOUT_W: 428,
    CALLOUT_H: 132,
    CALLOUT_Y: [84, 316, 548],
    TARGETS: [
      { x: 300, y: 172 },
      { x: 300, y: 384 },
      { x: 344, y: 566 }
    ]
  };

  /**
   * 恐惧来源：把「失去」和「被看见的不足」放进同一座冰山。
   *
   * 水面之上那个小三角是能被说出口的那部分恐惧；真正压着人的那一大团在水下，
   * 直到一束光扫过去才显形——而光扫过之后，从水里升起的东西才是「变强」。
   */
  function renderBerg(state, api) {
    var f = state.localFrame;
    var data = state.scene.data;
    var ann = data.annotations || {};
    var items = data.items || [];

    setPlainText(pick(state, 'title'), data.title);
    setPlainText(pick(state, 'surfaceNote'), ann.surface);

    buildOnce(pick(state, 'callouts'), JSON.stringify([items, ann]), function (host) {
      items.forEach(function (item, index) {
        var entry = typeof item === 'string' ? { label: item } : item;
        var isAccent = index === items.length - 1;
        var y = BERG.CALLOUT_Y[index];
        var target = BERG.TARGETS[index];
        var group = svgEl('g', { 'data-callout': String(index) });

        var link = svgEl('path', {
          class: 'berg-link' + (isAccent ? ' is-accent' : ''),
          d:
            'M' + BERG.CALLOUT_X + ' ' + (y + BERG.CALLOUT_H / 2) +
            ' C ' + (BERG.CALLOUT_X - 44) + ' ' + (y + BERG.CALLOUT_H / 2) +
            ', ' + (target.x + 70) + ' ' + target.y +
            ', ' + target.x + ' ' + target.y
        });
        group.appendChild(link);

        group.appendChild(
          svgEl('rect', {
            class: 'berg-callout' + (isAccent ? ' is-accent' : ''),
            x: BERG.CALLOUT_X,
            y: y,
            width: BERG.CALLOUT_W,
            height: BERG.CALLOUT_H,
            rx: 28
          })
        );

        var label = svgEl('text', {
          class: 'berg-callout-label' + (isAccent ? ' is-accent' : ''),
          x: BERG.CALLOUT_X + 32,
          y: y + 50
        });
        label.textContent = entry.label || '';
        group.appendChild(label);

        var desc = svgEl('text', {
          class: 'berg-callout-desc',
          x: BERG.CALLOUT_X + 32,
          y: y + 96
        });
        desc.textContent = entry.desc || '';
        group.appendChild(desc);

        host.appendChild(group);
      });
    });

    buildOnce(pick(state, 'sparks'), 'sparks', function (host) {
      // 5 颗上浮粒子：一致的小半径 + 收窄的横向抖动，读起来才是「一股上升」而不是噪点
      for (var i = 0; i < 5; i += 1) {
        host.appendChild(svgEl('circle', { class: 'berg-spark', r: 8, cx: 0, cy: 0 }));
      }
    });

    // 水面先画出来，再露出水上的一角
    api.drawPath(pick(state, 'waterLine'), api.progress(f, beat(state, 0.02), beat(state, 0.1), EASE_OUT), {
      length: 888
    });
    svgO(pick(state, 'waterBody'), api.progress(f, beat(state, 0.06), beat(state, 0.14), EASE_SYMMETRIC));
    svgO(pick(state, 'surfaceNote'), api.progress(f, beat(state, 0.1), beat(state, 0.08), EASE_SOFT));

    enterFig(state, api, pick(state, 'tip'), api.progress(f, beat(state, 0.1), beat(state, 0.14), EASE_OUT), {
      distance: 34,
      amplitude: 2
    });

    // 水下那一大团：从深处升上来，这是本幕的转折
    var massP = api.spring(api.progress(f, beat(state, 0.3), beat(state, 0.18), EASE_OUT), {
      damping: 6,
      frequency: 1.1
    });
    svgT(pick(state, 'massGroup'), 0, (1 - massP) * 150, 0, api.range(massP, 0.94, 1, { clamp: false }));
    svgO(pick(state, 'massGroup'), api.clamp(massP, 0, 1));

    // 三条标注按「先水上、再水下、最后出路」的顺序出现
    var callouts = pick(state, 'callouts') ? pick(state, 'callouts').children : [];
    var starts = [0.2, 0.5, 0.72];
    Array.prototype.forEach.call(callouts, function (group, index) {
      var start = beat(state, starts[index] === undefined ? 0.72 : starts[index]);
      var p = api.spring(api.progress(f, start, 24, EASE_OUT), { damping: 6, frequency: 1.2 });
      var link = group.firstChild;
      if (link) {
        if (!link.dataset.length) {
          link.dataset.length = String(link.getTotalLength());
        }
        api.drawPath(link, api.progress(f, start - 8, 22, EASE_SOFT), { length: Number(link.dataset.length) });
      }
      var body = group.children[1];
      var label = group.children[2];
      var desc = group.children[3];
      svgT(body, (1 - p) * 34, 0);
      svgO(body, api.clamp(p, 0, 1));
      svgT(label, (1 - p) * 34, 0);
      svgO(label, api.clamp(p, 0, 1));
      svgT(desc, (1 - p) * 34, 0);
      svgO(desc, api.clamp(p * 1.1, 0, 1));
    });

    // 光照：一束光扫过水下那团，被藏起来的部分显形
    var band = pick(state, 'lightBand');
    if (band) {
      var sweep = api.progress(f, beat(state, 0.56), beat(state, 0.2), EASE_SYMMETRIC);
      band.setAttribute('x', String(api.range(sweep, -320, 900)));
      svgO(band, api.progress(f, beat(state, 0.56), 20, EASE_SOFT) * (1 - api.progress(f, beat(state, 0.78), 24, EASE_SOFT) * 0.35));
    }

    // 光扫过之后浮出水面的一股上升：位置固定在冰山右侧的空白水域，不压到山体与标注
    var sparks = pick(state, 'sparks') ? pick(state, 'sparks').children : [];
    Array.prototype.forEach.call(sparks, function (spark, index) {
      var start = beat(state, 0.62) + index * 9;
      var life = api.progress(f, start, beat(state, 0.28), 'linear');
      var y = api.range(life, 620, 168);
      var x = 344 + ((index % 3) - 1) * 30 + Math.sin(life * Math.PI) * 10;
      spark.setAttribute('cx', x.toFixed(1));
      spark.setAttribute('cy', y.toFixed(1));
      svgO(spark, Math.sin(clampStatic(life, 0, 1) * Math.PI) * 0.9);
    });
  }

  /* ---------------- 04 飞轮 ---------------- */

  var LOOP = {
    CX: 444,
    CY: 290,
    R: 200,
    NODE_R: 76,
    SEGMENTS: 6,
    LAPS: 2
  };

  function loopPoint(travel) {
    var angle = ((-90 + travel * 120) * Math.PI) / 180;
    return {
      x: LOOP.CX + LOOP.R * Math.cos(angle),
      y: LOOP.CY + LOOP.R * Math.sin(angle)
    };
  }

  /**
   * 反馈循环：不做三个静止的方块加箭头，而是让一个点真的转起来。
   *
   * 每转一格，下面的「准备度」就抬高一截；两次完整循环之后条满。运动本身
   * 就是论点——上场不是一个动作，而是一个会自己加速的轮子。
   */
  function renderLoop(state, api) {
    var f = state.localFrame;
    var data = state.scene.data;
    var ann = data.annotations || {};
    var nodes = data.nodes || [];

    setPlainText(pick(state, 'title'), data.title);
    setPlainText(pick(state, 'gaugeLabel'), ann.gauge);

    buildOnce(pick(state, 'arcs'), JSON.stringify(nodes), function (host) {
      nodes.forEach(function (name, index) {
        var from = loopPoint(index + 0);
        var to = loopPoint(index + 1);
        host.appendChild(
          svgEl('path', {
            class: 'loop-arc',
            'data-arc': String(index),
            d:
              'M' + from.x.toFixed(2) + ' ' + from.y.toFixed(2) +
              ' A ' + LOOP.R + ' ' + LOOP.R + ' 0 0 1 ' + to.x.toFixed(2) + ' ' + to.y.toFixed(2)
          })
        );
      });
    });

    buildOnce(pick(state, 'nodes'), JSON.stringify(nodes), function (host) {
      nodes.forEach(function (name, index) {
        var label = typeof name === 'string' ? name : name.label || name.id;
        var point = loopPoint(index);
        var group = svgEl('g', { 'data-node': String(index) });
        group.appendChild(
          svgEl('circle', { class: 'loop-node-shadow', cx: point.x, cy: point.y + 12, r: LOOP.NODE_R })
        );
        group.appendChild(
          svgEl('circle', { class: 'loop-node-disc', cx: point.x, cy: point.y, r: LOOP.NODE_R })
        );
        var text = svgEl('text', { class: 'loop-node-text', x: point.x, y: point.y });
        text.textContent = label;
        group.appendChild(text);
        host.appendChild(group);
      });
    });

    // 轨道先淡入
    var track = pick(state, 'track');
    if (track) {
      track.style.opacity = String(api.progress(f, beat(state, 0.06), beat(state, 0.08), EASE_OUT));
    }

    // 小球：每格 SEG 帧，走满 6 格正好把「准备度」填满
    var travelStart = beat(state, 0.2);
    var segFrames = Math.max((state.sceneDurationFrames - travelStart) / LOOP.SEGMENTS, 1);
    var travel = clampStatic((f - travelStart) / segFrames, 0, LOOP.SEGMENTS);
    var point = loopPoint(travel);
    var arrived = Math.floor(travel);
    var frac = travel - arrived;

    /*
     * 节点只有一个 transform 写入点：入场位移、缩放入场与「到达时鼓一下」
     * 必须合成同一条 transform，否则后写的那条会把先写的覆盖掉。
     */
    var nodeGroups = pick(state, 'nodes') ? pick(state, 'nodes').children : [];
    var nodeStart = beat(state, 0.12);
    Array.prototype.forEach.call(nodeGroups, function (group, index) {
      var enterP = api.spring(api.progress(f, nodeStart + index * 8, 22, EASE_OUT), {
        damping: 6,
        frequency: 1.1
      });
      var nodePoint = loopPoint(index);
      var pulse = index === arrived % nodeGroups.length ? clampStatic(1 - frac / 0.5, 0, 1) : 0;
      var scale = api.range(enterP, 0.94, 1, { clamp: false }) * (1 + pulse * 0.09);
      svgT(
        group,
        nodePoint.x * (1 - scale),
        nodePoint.y * (1 - scale) + (1 - clampStatic(enterP, 0, 1)) * 26,
        0,
        scale
      );
      svgO(group, api.clamp(enterP, 0, 1));
    });

    var arcs = pick(state, 'arcs') ? pick(state, 'arcs').children : [];
    Array.prototype.forEach.call(arcs, function (path, index) {
      if (!path.dataset.length) {
        path.dataset.length = String(path.getTotalLength());
      }
      api.drawPath(path, clampStatic(travel - index, 0, 1), { length: Number(path.dataset.length) });
    });

    var token = pick(state, 'token');
    var halo = pick(state, 'tokenHalo');
    var tokenIn = api.progress(f, travelStart - 6, 18, EASE_OUT);
    svgO(token, tokenIn);
    svgO(halo, tokenIn * 0.55);
    if (token) {
      token.setAttribute('cx', point.x.toFixed(2));
      token.setAttribute('cy', point.y.toFixed(2));
    }
    if (halo) {
      halo.setAttribute('cx', point.x.toFixed(2));
      halo.setAttribute('cy', point.y.toFixed(2));
    }

    // 到达节点时节点鼓一下，让「一圈」有落点（与入场 transform 已在上方合成）
    var gaugeFill = pick(state, 'gaugeFill');
    if (gaugeFill) {
      gaugeFill.style.width = (clampStatic(travel / LOOP.SEGMENTS, 0, 1) * 100).toFixed(2) + '%';
    }
  }

  /* ---------------- 05 阶梯 ---------------- */

  var STAIRS = {
    BASE: 545,
    BAR_W: 152,
    GAP: 64,
    HEIGHTS: [100, 210, 330, 460],
    START: [0.07, 0.24, 0.48, 0.73]
  };

  function stairCenter(index) {
    var total = STAIRS.HEIGHTS.length * STAIRS.BAR_W + (STAIRS.HEIGHTS.length - 1) * STAIRS.GAP;
    return (888 - total) / 2 + index * (STAIRS.BAR_W + STAIRS.GAP) + STAIRS.BAR_W / 2;
  }

  /**
   * 上场的复利：把四个阶段画成四根越站越高的柱子。
   *
   * 柱子高度是「你在面试里的位置」，小球一跳一格；最后一格柱子转成强调色，
   * 顶部的标签从「公司在挑你」翻成「你在挑公司」——主动权换手，是本片的落点。
   */
  function renderStairs(state, api) {
    var f = state.localFrame;
    var data = state.scene.data;
    var ann = data.annotations || {};
    var items = data.items || [];

    setPlainText(pick(state, 'title'), data.title);
    setPlainText(pick(state, 'axisLabel'), ann.axis);

    buildOnce(pick(state, 'bars'), JSON.stringify(items), function (host) {
      items.forEach(function (item, index) {
        var entry = typeof item === 'string' ? { label: item } : item;
        var cx = stairCenter(index);
        var group = svgEl('g', { 'data-bar': String(index) });

        var bar = svgEl('rect', {
          class: 'stair-bar',
          x: cx - STAIRS.BAR_W / 2,
          y: STAIRS.BASE,
          width: STAIRS.BAR_W,
          height: 0,
          rx: 20
        });
        group.appendChild(bar);

        var note = svgEl('text', { class: 'stair-note', x: cx, y: STAIRS.BASE - STAIRS.HEIGHTS[index] - 44 });
        note.textContent = entry.note || '';
        group.appendChild(note);

        var label = svgEl('text', { class: 'stair-label', x: cx, y: STAIRS.BASE + 52 });
        label.textContent = entry.label || '';
        group.appendChild(label);

        host.appendChild(group);
      });
    });

    api.drawPath(pick(state, 'baseline'), api.progress(f, beat(state, 0.04), beat(state, 0.12), EASE_OUT), {
      length: 842
    });
    api.drawPath(pick(state, 'axis'), api.progress(f, beat(state, 0.05), beat(state, 0.14), EASE_OUT), {
      length: 467
    });

    var groups = pick(state, 'bars') ? pick(state, 'bars').children : [];
    Array.prototype.forEach.call(groups, function (group, index) {
      var start = beat(state, STAIRS.START[index] === undefined ? 0.73 : STAIRS.START[index]);
      var p = api.spring(api.progress(f, start, 26, EASE_OUT), { damping: 6, frequency: 1.2 });

      var bar = group.children[0];
      var note = group.children[1];
      var label = group.children[2];
      var height = (STAIRS.HEIGHTS[index] || 120) * clampStatic(p, 0, 1);
      bar.setAttribute('y', String(STAIRS.BASE - height));
      bar.setAttribute('height', String(height));
      var isFocus = index === groups.length - 1 && p > 0.95;
      bar.setAttribute('class', 'stair-bar' + (isFocus ? ' is-focus' : ''));
      note.setAttribute('class', 'stair-note' + (isFocus ? ' is-focus' : ''));
      note.setAttribute('y', String(STAIRS.BASE - height - 44));
      svgO(note, clampStatic((p - 0.55) * 2.2, 0, 1));
      svgO(label, clampStatic((p - 0.3) * 2, 0, 1));
    });

    // 说明文字跟着小球走：口播念到哪一句，屏幕上就是哪一句
    var caption = pick(state, 'caption');
    if (caption) {
      var active = 0;
      items.forEach(function (item, index) {
        if (f >= beat(state, STAIRS.START[index] === undefined ? 0.73 : STAIRS.START[index])) {
          active = index;
        }
      });
      var entry = typeof items[active] === 'string' ? { desc: items[active] } : items[active] || {};
      setPlainText(caption, entry.desc);
      var captionP = api.progress(f, beat(state, 0.03), 22, EASE_OUT);
      caption.style.opacity = String(api.clamp(captionP, 0, 1) * 0.94);
    }

    // 小球：逐格跳，落点就是那一格的柱顶
    var marker = pick(state, 'marker');
    var halo = pick(state, 'markerHalo');
    var firstStart = beat(state, STAIRS.START[0]);
    var markerIn = api.progress(f, firstStart, 20, EASE_OUT);
    var pos = { x: stairCenter(0), y: STAIRS.BASE - STAIRS.HEIGHTS[0] };
    for (var i = 1; i < groups.length; i += 1) {
      var hopStart = beat(state, STAIRS.START[i]) - beat(state, 0.05);
      var hop = api.progress(f, hopStart, beat(state, 0.05), EASE_SYMMETRIC);
      if (f >= hopStart) {
        var prev = { x: stairCenter(i - 1), y: STAIRS.BASE - STAIRS.HEIGHTS[i - 1] };
        var next = { x: stairCenter(i), y: STAIRS.BASE - STAIRS.HEIGHTS[i] };
        pos = {
          x: api.lerp(prev.x, next.x, hop),
          y: api.lerp(prev.y, next.y, hop) - Math.sin(hop * Math.PI) * 96
        };
      }
    }
    if (marker) {
      marker.setAttribute('cx', pos.x.toFixed(1));
      marker.setAttribute('cy', pos.y.toFixed(1));
    }
    if (halo) {
      halo.setAttribute('cx', pos.x.toFixed(1));
      halo.setAttribute('cy', pos.y.toFixed(1));
      svgO(halo, markerIn * 0.9);
    }
    svgO(marker, markerIn);

    // 主动权换手
    var flip = pick(state, 'flip');
    var flipP = api.progress(f, beat(state, 0.84), beat(state, 0.1), EASE_SYMMETRIC);
    if (flip) {
      flip.classList.toggle('is-after', flipP > 0.5);
      flip.style.opacity = String(api.progress(f, beat(state, 0.8), 20, EASE_OUT));
    }
    var arrow = pick(state, 'flipArrow');
    if (arrow) {
      arrow.className = 'flip-arrow ' + (flipP > 0.5 ? 'is-right' : 'is-left');
    }
    setPlainText(pick(state, 'flipText'), flipP > 0.5 ? ann.after : ann.before);
  }

  /* ---------------- 06 双向选择 ---------------- */

  /**
   * 收束：两支箭头同时存在，才叫「互相挑」。
   *
   * 先用逐字揭示把结论读出来，再让两端的节点和两条反向箭头成立；最后一条
   * 强调色箭头是「你也在挑公司」，与开场的天平形成同一支片子的呼应。
   */
  function renderChoice(state, api) {
    var f = state.localFrame;
    var data = state.scene.data;
    var ann = data.annotations || {};
    var text = pick(state, 'text');
    var action = pick(state, 'action');

    setPlainText(pick(state, 'nodeLeftText'), ann.leftNode);
    setPlainText(pick(state, 'nodeRightText'), ann.rightNode);

    if (action) {
      action.textContent = data.action || '';
      action.style.display = data.action ? '' : 'none';
    }

    if (text) {
      revealKeyChars(text, data.text || '', f, data.emphasis || [], {
        startFrame: beat(state, 0.02),
        staggerFrames: 2
      });
    }

    enterFig(state, api, pick(state, 'nodeLeft'), api.progress(f, beat(state, 0.2), 24, EASE_OUT), {
      distance: 34,
      amplitude: 2.5,
      axis: 'x',
      scale: 0.94
    });
    enterFig(state, api, pick(state, 'nodeRight'), api.progress(f, beat(state, 0.26), 24, EASE_OUT), {
      distance: -34,
      amplitude: 2.5,
      axis: 'x',
      scale: 0.94
    });

    var arcTo = pick(state, 'arcTo');
    var arcBack = pick(state, 'arcBack');
    api.drawPath(arcTo, api.progress(f, beat(state, 0.36), beat(state, 0.1), EASE_SOFT), { length: 392 });
    api.drawPath(arcBack, api.progress(f, beat(state, 0.44), beat(state, 0.1), EASE_SOFT), { length: 392 });
    /*
     * 箭头朝向取曲线末端的切线方向：二次贝塞尔在终点的切向是「终点 − 控制点」。
     * 硬编码角度会在改曲线端点时静默错位，所以这里由同一组常量算出来。
     */
    placeArrow(pick(state, 'arrowTo'), 628, 118, Math.atan2(118 - 66, 628 - 445) * 180 / Math.PI,
      api.progress(f, beat(state, 0.46), 14, EASE_OUT));
    placeArrow(pick(state, 'arrowBack'), 264, 182, Math.atan2(182 - 234, 264 - 445) * 180 / Math.PI,
      api.progress(f, beat(state, 0.54), 14, EASE_OUT));

    var key = text ? text.querySelector('.key') : null;
    if (key) {
      var highlight = api.progress(f, beat(state, 0.56), beat(state, 0.1), EASE_SYMMETRIC);
      key.style.textShadow =
        '0 0 ' + api.range(highlight, 0, 30).toFixed(1) + 'px rgba(var(--a2v-accent-rgb), ' +
        api.range(highlight, 0, 0.24).toFixed(3) + ')';
    }

    var actionP = api.progress(f, beat(state, 0.64), 28, EASE_OUT);
    if (action) {
      var shift = api.range(api.spring(actionP, { damping: 6, frequency: 1.1 }), 34, 0, { clamp: false });
      var drift = api.breath(f, { periodFrames: 150, amplitude: 3 }) *
        api.progress(f, beat(state, 0.64), 40, EASE_SYMMETRIC);
      action.style.transform = 'translate3d(' + shift.toFixed(2) + 'px,' + drift.toFixed(2) + 'px,0)';
      action.style.opacity = String(api.clamp(actionP, 0, 1));
    }
  }

  /** 箭头头部：一个按切线方向旋转的三角形，位置与朝向都由常量算出。 */
  function placeArrow(node, x, y, angleDeg, opacity) {
    if (!node) {
      return;
    }
    svgT(node, x, y, angleDeg);
    node.setAttribute('d', 'M0 0 L-34 -16 L-34 16 Z');
    svgO(node, opacity);
  }

  /* ---------------- 结论幕的逐字揭示 ---------------- */

  /**
   * 逐字揭示 + 强调短语。
   *
   * 文本结构只在内容变化时重建，之后每帧只改各字的不透明度，因此同一帧永远
   * 得到同一画面；强调短语整体比正文晚 6 帧出现，读起来有轻重。
   */
  function revealKeyChars(el, text, frame, phrases, options) {
    var o = options || {};
    var start = o.startFrame === undefined ? 0 : o.startFrame;
    var stagger = Math.max(o.staggerFrames === undefined ? 2 : o.staggerFrames, 1);
    var value = text == null ? '' : String(text);
    var units = splitEmphasis(value, phrases);
    var signature = value + '|' + units.map(function (unit) {
      return (unit.key ? 'k' : '_') + unit.text;
    }).join('');

    if (el.getAttribute('data-a2v-emphasis-text') !== signature) {
      el.textContent = '';
      var frag = document.createDocumentFragment();
      units.forEach(function (unit) {
        var holder = document.createElement('span');
        holder.className = unit.key ? 'key' : 'plain';
        Array.prototype.slice.call(unit.text).forEach(function (ch) {
          var span = document.createElement('span');
          span.className = ch === '\n' ? 'reveal-char is-break' : 'reveal-char';
          span.textContent = ch;
          holder.appendChild(span);
        });
        frag.appendChild(holder);
      });
      el.appendChild(frag);
      el.setAttribute('data-a2v-emphasis-text', signature);
    }

    var spans = el.querySelectorAll('.reveal-char');
    var index = 0;
    Array.prototype.forEach.call(spans, function (span) {
      if (span.classList.contains('is-break')) {
        return;
      }
      var isKey = !!span.closest('.key');
      var charStart = start + index * stagger + (isKey ? 6 : 0);
      span.style.opacity = String(clampStatic((frame - charStart) / stagger, 0, 1));
      index += 1;
    });
  }

  /** 把文本切成「普通片段 / 强调片段」，强调片段是 phrases 中第一处命中的部分。 */
  function splitEmphasis(text, phrases) {
    var list = phrases || [];
    for (var i = 0; i < list.length; i += 1) {
      var phrase = list[i];
      if (typeof phrase !== 'string' || !phrase) {
        continue;
      }
      var at = text.indexOf(phrase);
      if (at === -1) {
        continue;
      }
      return [
        { text: text.slice(0, at), key: false },
        { text: phrase, key: true },
        { text: text.slice(at + phrase.length), key: false }
      ].filter(function (unit) {
        return unit.text !== '';
      });
    }
    return [{ text: text, key: false }];
  }

  /* ---------------- 分派 ---------------- */

  var renderers = {
    title: renderOpening,
    quote: renderLoss,
    list: renderBerg,
    diagram: renderLoop,
    timeline: renderStairs,
    conclusion: renderChoice
  };

  /** 单帧渲染入口：由时间轴运行时按帧号调用，必须保持纯函数式。 */
  function renderFrame(state, api) {
    var renderer = renderers[state.scene.type];
    if (!renderer) {
      throw new Error('网页未实现场景类型: ' + state.scene.type);
    }
    renderer(state, api);
  }

  A2V.fetchStoryboard('storyboard.json')
    .then(function (storyboard) {
      A2V.mount({ storyboard: storyboard, render: renderFrame });
      return window.__A2V__.ready();
    })
    .catch(function (error) {
      // 出错时把原因写进画面，避免渲染出「全黑但成功」的视频
      document.body.innerHTML =
        '<pre style="font:28px/1.6 monospace;padding:80px;color:#a1231a">' +
        '网页启动失败：\n' + String(error && error.message ? error.message : error) +
        '\n\n如果是直接双击打开的 HTML，请改用本地服务器预览：\n' +
        'uv run python .agents/skills/article2video/scripts/preview.py videos/never-fear-interviews' +
        '</pre>';
      throw error;
    });
})();
</script>
</body>
</html>
