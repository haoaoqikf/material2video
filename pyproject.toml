[project]
name = "article2video"
version = "0.1.0"
description = "AI 编写动画网页，确定性逐帧渲染为视频的项目级 Skill"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.55,<2",
    "imageio-ffmpeg>=0.6,<0.7",
    "edge-tts>=7.2.8,<8",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: 需要起浏览器或跑真实渲染的用例，用 -m 'not slow' 可跳过",
]
