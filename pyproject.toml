[project]
name = "material2video"
version = "0.1.0"
description = "从文章、金融数据与场景材料到成片的离线视频制作工具链"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.55,<2",
    "imageio-ffmpeg>=0.6,<0.7",
    "edge-tts>=7.2.8,<8",
]

[project.scripts]
m2v = "m2v.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: 需要浏览器、真实渲染或长时等待的用例；默认不运行，-m slow 单独运行",
    "media: 需要 ffmpeg 真实编解码的用例；默认不运行，-m 'not slow' 连同默认层一起运行",
]

# 子集化用的可选依赖：默认渲染完全离线可跑，装了并显式开启才会切字体。
# 没装的机器不会因此少任何能力，只是不能切子集。
[project.optional-dependencies]
fonts = ["fonttools>=4.50,<5"]
