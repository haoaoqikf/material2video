[project]
name = "article2video"
version = "0.1.0"
description = "把观点型文章制作成竖屏信息可视化短视频的项目级 Skill"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.55,<2",
    "imageio-ffmpeg>=0.6,<0.7",
    "edge-tts>=7.2.8,<8",
]

[project.scripts]
a2v = "a2v.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: 需要起浏览器或跑真实渲染的用例，用 -m 'not slow' 可跳过",
]

# 子集化用的可选依赖：默认渲染完全离线可跑，装了并显式开启才会切字体。
# 没装的机器不会因此少任何能力，只是不能切子集。
[project.optional-dependencies]
fonts = ["fonttools>=4.50,<5"]
