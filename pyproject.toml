[project]
name = "material2video"
version = "0.1.0"
description = "从文章、金融数据与场景材料到成片的离线视频制作工具链"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.55,<2",
    "imageio-ffmpeg>=0.6,<0.7",
    "edge-tts>=7.2.8,<8",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    # 素材 worker 使用经专项测试的 handler/downloader API，升级必须重新核验安全边界。
    "yt-dlp==2026.10.26",
    "pydantic>=2,<3",
    "lxml==6.1.3",
]

[project.optional-dependencies]
# 本地中文配音后端；只有使用 tts.backend = "kokoro" 的作品需要。
kokoro = [
    "kokoro==0.9.4",
    "misaki[zh]==0.9.4",
]
# 素材工作层的可选索引能力；只进入制作管理环境，不加入作品运行时。
asr = ["faster-whisper==1.2.1", "av==18.1.0"]
ocr = ["onnxruntime==1.32.0", "rapidocr==3.10.0"]
semantic = ["transformers==5.23.0", "torch==2.15.0", "sentencepiece==0.2.3", "safetensors==0.8.0"]
vision = ["transformers==5.23.0", "torch==2.15.0", "safetensors==0.8.0"]
scenes = ["scenedetect==0.7.3"]
models = ["huggingface-hub==2.4.0"]
# 组合安装：uv sync --extra index
index = [
    "faster-whisper==1.2.1",
    "av==18.1.0",
    "onnxruntime==1.32.0",
    "rapidocr==3.10.0",
    "transformers==5.23.0",
    "torch==2.15.0",
    "sentencepiece==0.2.3",
    "safetensors==0.8.0",
    "scenedetect==0.7.3",
    "huggingface-hub==2.4.0",
]

[project.scripts]
m2v = "m2v.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "fonttools>=4.50,<5",
    "numpy>=2,<3",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"m2v.engine" = ["kokoro_voices.json"]
"m2v.materials" = ["model_registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: 需要浏览器、真实渲染或长时等待；默认排除，在相关范围内显式选择",
    "media: 需要 ffmpeg 真实编解码；默认排除，在相关范围内显式选择",
]
