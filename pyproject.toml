[project]
name = "material2video"
version = "0.1.0"
description = "从文章、金融数据与场景材料到成片的离线视频制作工具链"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.55,<2",
    "imageio-ffmpeg>=0.6,<0.7",
    "edge-tts>=7.2.8,<8",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "fonttools>=4.50,<5",
    "yt-dlp>=2026.10.26",
    "pydantic>=2,<3",
]

[project.scripts]
m2v = "m2v.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: 需要浏览器、真实渲染或长时等待；默认排除，在相关范围内显式选择",
    "media: 需要 ffmpeg 真实编解码；默认排除，在相关范围内显式选择",
]
