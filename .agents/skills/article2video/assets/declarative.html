<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>article2video 声明式画面</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="theme.css">
<!-- 设计语言层：只在分镜声明 visual.preset 时生效，未启用时画面逐帧不变 -->
<link rel="stylesheet" href="keynote.css">
<link rel="stylesheet" href="figures.css">
<link rel="stylesheet" href="declarative.css">
</head>
<body>
<div data-a2v-stage>
  <div class="a2v-bg-glow stage-bg" aria-hidden="true"></div>
  <div class="a2v-bg-grid stage-bg" aria-hidden="true"></div>
  <div class="a2v-bg-grain stage-bg" aria-hidden="true"></div>
</div>
<div data-a2v-controls class="a2v-preview-only">
  <button type="button" data-a2v-play>播放</button>
  <button type="button" data-a2v-replay>重播</button>
  <input type="range" data-a2v-seek min="0" max="1" value="0" aria-label="进度">
  <span data-a2v-time>0:00 / 0:00</span>
</div>
<!-- 弹簧求解器：vendored 的阻尼谐振子闭式解（wobble 1.5.1 · MIT），timeline.js 依赖它 -->
<script src="vendor/spring.js"></script>
<script src="timeline.js"></script>
<script src="typography.js"></script>
<script src="figures.js"></script>
<script src="declarative.js"></script>
</body>
</html>
