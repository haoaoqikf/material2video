schema: spec-driven

context: |
  项目：material2video，使用共享制作底座、独立视频类型和统一制作入口，优先发展金融时间序列等专用视频，持续完善通用混合媒体讲解。
  当前类型包括 financial-timeseries（行情与假设投资时间序列）、housing-timeseries（年度住宅均价折线）与 general（通用 v8 全画布代码场景讲解，保留真实配音、输入语义审查及完整候选自动验收）。旧 article-narrative 身份、m2v article 命令、general-plan 编排与完整片段嵌入已删除；作品画面以 v8 的本地 TSX 全画布逐帧录制链路提供。
  通用 v8 使用 scenes 多幕讲解，每一幕都是作品 `scenes/` 下的本地 React 代码场景，画幅默认为 1920×1080 横屏并支持显式 1080×1920 竖屏，完整成片最多 600 秒；代码片段在检查或正式生成时按所需窗口逐帧录制并缓存，检查和正式生成按区间复用录制缓存。图片与视频经已导入素材 ID 解析，比例不受画幅限制。原文输入需非空源文，主题输入按逐幕关键词检索，均不限制标准字数。旧 v7 及更早分镜需重新编排，不自动迁移。
  Python 生产实现位于 src/m2v/：core（作品契约与指纹）、engine（构建、缓存、渲染、合成与验收）、types（业务类型与注册）、cli（统一入口）；Skill 只保留创作指导和参考契约。
  技术栈：Python（类型校验与渲染编排）、React 19 + TypeScript + Remotion（画面 composition），
  Playwright（契约页量测）、ffmpeg（成片验收与音轨）；Python 依赖由 uv 管理，web 依赖由 pnpm 管理。
  当前能力与文档导航见 README.md；未来路线以 docs/PROJECT_PLAN.md 为准。
  视频类型创作流程及渲染、分镜、视觉契约以 .agents/skills/material2video/ 中的文档为准；统一 CLI 与架构契约以 README 和 openspec/specs 为准。
  始终使用中文编写面向本项目的变更文档。
  不把规划中的能力写成已实现；变更渲染契约、分镜结构或视觉规范时，同步更新对应参考文档、校验器和示例。
  实施完成后自动归档：apply 的任务全部完成、验证与提交通过后，直接同步 openspec/specs/ 主规格并把变更移入
  openspec/changes/archive/，不再单独征求确认；约定细节见 AGENTS.md 的「OpenSpec 工作流」。
