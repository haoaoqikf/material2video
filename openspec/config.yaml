schema: spec-driven

context: |
  项目：article2video，使用共享制作底座、独立视频类型和统一制作入口，优先发展金融时间序列等专用视频，再逐步扩展通用多场景编排。
  当前类型包括 financial-timeseries（独立行情材料、假设投资计算和手机可读性门禁）、article-narrative（文章 v4 单场景叙事、配音、状态轨道、镜头、代码世界及制作门禁）与 general（受控图文、完整类型片段和公开代码场景组合）。
  文章 v4 仍围绕一个持续 world 与多阶段叙事；130～170字正文/口播、35～45秒和连续性评审只适用于文章类型，不约束金融或整条通用视频。历史文章 v1～v3 需重新编排。
  Python 生产实现位于 src/a2v/：core（作品契约与指纹）、engine（构建、缓存、渲染、合成与验收）、types（业务类型与注册）、cli（统一入口）；Skill 只保留创作指导和参考契约。
  技术栈：Python（类型校验与渲染编排）、React 19 + TypeScript + Remotion（画面 composition），
  Playwright（契约页量测）、ffmpeg（成片验收与音轨）；Python 依赖由 uv 管理，web 依赖由 pnpm 管理。
  当前能力与文档导航见 README.md；未来路线以 docs/PROJECT_PLAN.md 为准。
  视频类型创作流程及渲染、分镜、视觉契约以 .agents/skills/article2video/ 中的文档为准；统一 CLI 与架构契约以 README 和 openspec/specs 为准。
  始终使用中文编写面向本项目的变更文档。
  不把规划中的能力写成已实现；变更渲染契约、分镜结构或视觉规范时，同步更新对应参考文档、校验器和示例。
  实施完成后自动归档：apply 的任务全部完成、验证与提交通过后，直接同步 openspec/specs/ 主规格并把变更移入
  openspec/changes/archive/，不再单独征求确认；约定细节见 AGENTS.md 的「OpenSpec 工作流」。
