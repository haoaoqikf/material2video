schema: spec-driven

context: |
  项目：material2video，使用三类视频、统一分镜与代码场景制作链路。类型仅有 text-motion（图文动效）、data-evolution（数据演化）、spatial-3d（三维空间）。地图轨迹和情境叙事是表现手法，不设类型。作品目录为 videos/<type>/<slug>，示例目录为 examples/<type>/<slug>，没有类别、general、专项类型。类型目录发布带修订号的默认视觉参考集，工程在 design/style-binding.json 固化目标和授权范围。
  作品使用独立工程 v3（project schemaVersion=3）和分镜 v9。每幕是作品 scenes/ 下的本地 React 代码场景，三类采用 SceneFilm 契约及作品自有的准备、预演、渲染和技术检查入口，主项目可选管理制作证据。金融行情与投资计算、建筑构件与步骤、汽车模型与镜头作为分镜结构化来源供场景引用。旧类型、风格字段、旧材料和准备记录明确拒绝，不提供迁移入口。
  主项目 Python 制作工具位于 src/m2v/：core（作品契约与指纹）、engine（通用媒体、音频、字幕、素材与本地委托工具）、type_system（三类目录）、types/scene_film（统一分镜校验与委托）、types/financial、types/building_construction、types/vehicle_showcase（结构化来源校验与数据）、production（媒体评审、问题与状态）、reference（外部参考）、cli（统一入口）。构建、采集、渲染、合成与 QA 实现只在模板与作品运行时；web/src/scene-film/ 与 web/src/code-scene/ 为组件参考和起步源码；作品运行时、依赖和字体归工程自有，采用的源码及递归依赖须进入工程，运行不依赖主项目。作品专属代码在 scenes/ 下。Skill 记录创作指导和参考契约。
  技术栈：Python（类型校验与渲染编排）、React 19 + TypeScript + Remotion（画面 composition），
  Playwright（代码场景采集）、ffmpeg（成片验收与音轨）；Python 依赖由 uv 管理，web 依赖由 pnpm 管理。
  当前能力与文档导航见 README.md；未来路线以 docs/PROJECT_PLAN.md 为准。
  视频类型创作流程及渲染、分镜、视觉契约以 .agents/skills/material2video/ 中的文档为准；统一 CLI 与架构契约以 README 和 openspec/specs 为准。
  始终使用中文编写面向本项目的变更文档。
  OpenSpec 适用范围以 AGENTS.md「OpenSpec 工作流」为准，按影响范围而非修改行数判断。
  简单、局部、影响明确的文案、制作规范补充、维护和已有明确预期的缺陷修复可直接实施，无需创建变更；
  实施前简述理由，仍须验证、同步文档、检查暂存并自动提交。边界不明先检查影响，超出简单范围先补建提案、规格与任务再继续。
  新增或移除能力、命令、类型，改变材料／分镜／渲染／兼容契约，调整核心流程、评审职责、验收门禁或完成条件，
  以及跨模块重要行为变化、有明显方案分歧或影响难以确定的修改，必须使用 OpenSpec；命中这些条件不得按简单变更豁免。
  用户明确要求使用 OpenSpec 或继续已有变更时按指定流程处理；简单变更不创建提案和归档材料。
  不把规划中的能力写成已实现；变更渲染契约、分镜结构或视觉规范时，同步更新对应参考文档、校验器和示例。
  实施完成后自动归档：apply 的任务全部完成、验证与提交通过后，直接同步 openspec/specs/ 主规格并把变更移入
  openspec/changes/archive/，不再单独征求确认；约定细节见 AGENTS.md 的「OpenSpec 工作流」。
